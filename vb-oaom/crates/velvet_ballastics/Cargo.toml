[package]
name = "velvet_ballastics"
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"
publish = false

[dependencies]
blake3 = "1"
vb_compile = { path = "../../../vb-2yb8-ws/crates/vb_compile" }
vb_core = { path = "../../../vb-2yb8-ws/crates/vb_core" }
vb_codegen = { path = "../../../vb-2yb8-ws/crates/vb_codegen" }
vb_expr = { path = "../../../vb-2yb8-ws/crates/vb_expr" }
vb_ipc = { path = "../../../vb-2yb8-ws/crates/vb_ipc" }
vb_runtime = { path = "../../../vb-2yb8-ws/crates/vb_runtime" }
vb_storage = { path = "../../../vb-2yb8-ws/crates/vb_storage" }
vb_validate = { path = "../../../vb-2yb8-ws/crates/vb_validate" }
vb_yaml = { path = "../../../vb-2yb8-ws/crates/vb_yaml" }
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["alloc"] }
serde-saphyr = "0.0.25"

[[bin]]
name = "velvet-ballastics"
path = "src/main.rs"

[[bin]]
name = "vb"
path = "src/main.rs"

[dev-dependencies]
blake3 = "1"
bytes = "1"
serde = "1"
tempfile = "3"
proptest = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "warn"
todo = "warn"
