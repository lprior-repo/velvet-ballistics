\* Scenario: duplicate successful action completion is idempotent/no mutation.
SPECIFICATION Spec
CONSTANTS
    MaxRuns = 1
    MaxActions = 1
    MaxSeq = 3
    NullDigest = 0
    Digests = {0, 1}
INVARIANT TypeOK
INVARIANT NoDuplicateJournalEvents
INVARIANT DigestBinding
INVARIANT NoReplayOfResolvedActions
INVARIANT NoSuccessFailureConflict
PROPERTY MonotonicCompletedActions
CHECK_DEADLOCK TRUE
