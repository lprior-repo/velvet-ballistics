fileGroups:
  sources:
    - 'Cargo.toml'
    - 'Cargo.lock'
    - 'rust-toolchain.toml'
    - 'src/**/*'
    - 'crates/**/*'
    - 'benches/**/*'
    - 'examples/**/*'
    - 'build.rs'
  tests:
    - 'tests/**/*'
    - 'fuzz/**/*'
  configs:
    - '.cargo/**/*'
    - '.moon/**/*'
    - '.config/**/*'
    - 'deny.toml'
    - 'cargo-vet.toml'
    - 'justfile'
    - 'scripts/**/*'
  docs:
    - 'README.md'
    - 'docs/**/*'

tasks:
  fmt:
    command: 'rustup run nightly-2026-04-28 cargo fmt --all --check'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      runInCI: true

  lint-src:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      flock --shared target/moon-locks/source-mutation.lock rustup run nightly-2026-04-28 cargo clippy --workspace --lib --bins --examples --all-features -- -D warnings -W clippy::all -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic -D clippy::todo -D clippy::unimplemented -D clippy::dbg_macro -D clippy::print_stdout -D clippy::print_stderr
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    options:
      runInCI: true

  check:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      flock --shared target/moon-locks/source-mutation.lock timeout 10m rustup run nightly-2026-04-28 cargo check --workspace --all-targets --all-features
    deps:
      - 'nightly-feature-gate'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      runInCI: true

  nightly-feature-gate:
    command: 'bash scripts/check-nightly-features.sh'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      runInCI: true

  nightly-feature-cargo-probe:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      flock --shared target/moon-locks/source-mutation.lock rustup run nightly-2026-04-28 cargo check --workspace --all-targets --all-features
    deps:
      - 'nightly-feature-gate'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      runInCI: true

  source-length:
    command: 'bash scripts/check-source-length.sh'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      runInCI: true

  hardened-build:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      flock --shared target/moon-locks/source-mutation.lock env RUSTC_WRAPPER= CARGO_TARGET_DIR=target/hardened-build rustup run nightly-2026-04-28 cargo build --workspace --all-features --profile hardened
    deps:
      - 'check'
      - 'lint-src'
      - 'source-length'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    outputs:
      - 'target/hardened-build/hardened/**'
    options:
      cache: false
      runInCI: true

  test:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      flock --shared target/moon-locks/source-mutation.lock timeout 10m rustup run nightly-2026-04-28 cargo nextest run --workspace --all-features
    deps:
      - 'check'
      - 'supply-chain'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      runInCI: true

  doc-test:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      flock --shared target/moon-locks/source-mutation.lock rustup run nightly-2026-04-28 cargo test --doc --workspace --all-features
    deps:
      - 'check'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    options:
      runInCI: true

  doc:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      flock --shared target/moon-locks/source-mutation.lock rustup run nightly-2026-04-28 cargo doc --workspace --all-features --no-deps
    deps:
      - 'check'
      - 'supply-chain'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
      - '@globs(docs)'
    outputs:
      - 'target/doc/**'
    options:
      runInCI: true

  supply-chain:
    script: |
      set -euo pipefail
      timeout 2m rustup run nightly-2026-04-28 cargo audit
      timeout 5m rustup run nightly-2026-04-28 cargo deny check
      timeout 5m rustup run nightly-2026-04-28 cargo vet --store-path supply-chain --locked
      # Geiger is reporting-only: first-party unsafe is forbidden by workspace
      # lints; transitive unsafe remains visible here and governed by vet/deny.
      rm -rf target/supply-chain/geiger
      mkdir -p target/supply-chain/geiger
      for package in vb_codegen vb_compile vb_core vb_expr vb_ipc vb_runtime vb_storage vb_validate vb_yaml velvet-ballastics velvet-ballastics-fuzz; do
        package_target_dir="target/supply-chain/geiger/$package"
        mkdir -p "$package_target_dir"
        CARGO_TARGET_DIR="$package_target_dir" timeout --kill-after=10s 90s rustup run nightly-2026-04-28 cargo geiger -p "$package" --all-features --all-dependencies --include-tests --output-format GitHubMarkdown || true
      done
      timeout 2m rustup run nightly-2026-04-28 cargo machete --skip-target-dir crates/vb_codegen crates/vb_compile crates/vb_core crates/vb_expr crates/vb_ipc crates/vb_runtime crates/vb_storage crates/vb_validate crates/vb_yaml crates/velvet_ballastics fuzz
    toolchains:
      - rust
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'cargo-vet.toml'
      - 'supply-chain/**/*'
      - '@globs(configs)'
    options:
      runInCI: true

  feature-powerset:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      flock --exclusive target/moon-locks/source-mutation.lock timeout 10m rustup run nightly-2026-04-28 cargo hack check --workspace --feature-powerset --no-dev-deps
    deps:
      - 'check'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    options:
      runInCI: true

  miri:
    script: |
      set -euo pipefail
      mkdir -p target/miri-tmp
      mkdir -p target/moon-locks
      TMPDIR="$PWD/target/miri-tmp" flock --shared target/moon-locks/source-mutation.lock timeout 5m rustup run nightly-2026-04-28 cargo miri test -p vb_core -p vb_expr -p vb_validate --lib --all-features -- --skip proptests
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      runInCI: true

  coverage:
    script: |
      set -euo pipefail
      mkdir -p target/llvm-cov
      mkdir -p target/moon-locks
      flock --shared target/moon-locks/source-mutation.lock timeout 10m rustup run nightly-2026-04-28 cargo llvm-cov nextest --workspace --all-features --lcov --output-path target/llvm-cov/lcov.info
    deps:
      - 'test'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    outputs:
      - 'target/llvm-cov/**'
    options:
      runInCI: true

  mutants-smoke:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      # Smoke policy: prove cargo-mutants integration on a bounded, deterministic
      # vb_core slice without mutating the source tree in place. Full mutation-score
      # debt is tracked separately.
      flock --exclusive target/moon-locks/source-mutation.lock timeout 3m rustup run nightly-2026-04-28 cargo mutants \
        --package vb_core \
        --file crates/vb_core/src/diagnostic.rs \
        --re 'is_supported_code -> bool with false' \
        --baseline skip \
        --jobs 1 \
        --gitignore true \
        --no-shuffle \
        --no-times \
        --timeout 10 \
        --minimum-test-timeout 2 \
        --output target/mutants-smoke \
        -- --lib diagnostic::
    deps:
      - 'test'
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/vb_core/Cargo.toml'
      - 'crates/vb_core/src/diagnostic.rs'
      - '.moon/tasks/all.yml'
    options:
      cache: false
      runInCI: true

  fuzz-smoke:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      flock --shared target/moon-locks/source-mutation.lock rustup run nightly-2026-04-28 cargo fuzz build --target x86_64-unknown-linux-gnu
    toolchains:
      - rust
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'fuzz/**/*'
      - 'crates/vb_core/**/*'
      - 'crates/vb_yaml/**/*'
      - 'crates/vb_expr/**/*'
      - 'crates/vb_compile/**/*'
      - 'crates/vb_codegen/**/*'
      - 'crates/vb_ipc/**/*'
      - 'crates/vb_storage/**/*'
    options:
      runInCI: true

  sanitizer-address-check:
    script: 'RUSTFLAGS="-Zsanitizer=address" rustup run nightly-2026-04-28 cargo test -Zbuild-std --target x86_64-unknown-linux-gnu --workspace --all-features --no-run'
    deps:
      - 'check'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      runInCI: false

  bench-build:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      flock --shared target/moon-locks/source-mutation.lock rustup run nightly-2026-04-28 cargo bench --workspace --all-features --no-run
    deps:
      - 'check'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    outputs:
      - 'target/release/deps/**'
    options:
      runInCI: true

  benchmark-proof:
    command: 'rustup run nightly-2026-04-28 cargo bench --workspace --all-features -- --save-baseline vb-current'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    outputs:
      - 'target/criterion/**'
    options:
      runInCI: false

  pgo-instrument-build:
    script: 'RUSTFLAGS="-Cprofile-generate=$PWD/target/pgo/profiles" rustup run nightly-2026-04-28 cargo build -p velvet_ballastics --bin velvet-ballistics --bin vb --all-features --profile maxperf'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    outputs:
      - 'target/maxperf/**'
      - 'target/pgo/profiles/**'
    options:
      runInCI: false

  pgo-optimized-build:
    script: 'RUSTFLAGS="-Cprofile-use=$PWD/target/pgo/merged.profdata -Cllvm-args=-pgo-warn-missing-function" rustup run nightly-2026-04-28 cargo build -p velvet_ballastics --bin velvet-ballistics --bin vb --all-features --profile maxperf'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
      - 'target/pgo/merged.profdata'
    outputs:
      - 'target/maxperf/**'
    options:
      runInCI: false

  maxperf:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      flock --shared target/moon-locks/source-mutation.lock rustup run nightly-2026-04-28 cargo build --workspace --all-features --release
    deps:
      - 'check'
      - 'lint-src'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    outputs:
      - 'target/release/**'
    options:
      runInCI: true

  maxperf-native:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      export RUSTFLAGS="-C target-cpu=native"
      flock --shared target/moon-locks/source-mutation.lock rustup run nightly-2026-04-28 cargo build --workspace --all-features --release
    deps:
      - 'check'
      - 'lint-src'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    outputs:
      - 'target/release/**'
    options:
      runInCI: true

  quick:
    script: |
      moon run :fmt
      moon run :lint-src
      moon run :check
      moon run :nightly-feature-gate
    options:
      runInCI: false
