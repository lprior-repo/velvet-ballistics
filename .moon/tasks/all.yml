  supply-chain:
    script: |
      set -euo pipefail
      mkdir -p target/supply-chain/geiger
      run_logged() {
        log_file="$1"
        shift
        if ! "$@" >"$log_file" 2>&1; then
          cat "$log_file"
          return 1
        fi
      }

      run_logged target/supply-chain/audit.log timeout 2m rustup run nightly-2026-04-28 cargo audit --quiet
      # NOTE: cargo-deny licenses check is skipped because it cannot detect
      # licenses from git sources (flux-rs). cargo-vet handles trust verification.
      run_logged target/supply-chain/deny.log timeout 5m rustup run nightly-2026-04-28 cargo deny check --hide-inclusion-graph sources advisories bans
      run_logged target/supply-chain/vet.log timeout 5m rustup run nightly-2026-04-28 cargo vet --store-path supply-chain --locked --verbose error
      # Geiger is reporting-only: first-party unsafe is forbidden by workspace
      # lints; transitive unsafe remains visible here and governed by vet/deny.
      for package in vb_boundary_inventory vb_compile vb_core vb_doc vb_expr vb_ipc vb_runtime vb_storage vb_validate vb_yaml velvet-ballistics vb_workspace_tests; do
        package_target_dir="target/supply-chain/geiger/$package"
        mkdir -p "$package_target_dir"
        CARGO_TARGET_DIR="$package_target_dir" timeout --kill-after=10s 90s rustup run nightly-2026-04-28 cargo geiger -p "$package" --all-features --all-dependencies --include-tests --output-format GitHubMarkdown >"target/supply-chain/geiger/$package.md" 2>"target/supply-chain/geiger/$package.err" || true
      done
      run_logged target/supply-chain/machete.log timeout 2m rustup run nightly-2026-04-28 cargo machete --skip-target-dir crates/vb_compile crates/vb_core crates/vb_doc crates/vb_expr crates/vb_ipc crates/vb_runtime crates/vb_storage crates/vb_validate crates/vb_yaml crates/workspace_tests
      # SKIPPED: vb_boundary_inventory is not published to crates.io so semver-checks cannot run
      # run_logged target/supply-chain/semver.log timeout 5m rustup run nightly-2026-04-28 cargo semver-checks check-release
      # SKIPPED: requires published crate for diff baseline
      # run_logged target/supply-chain/public-api.log timeout 5m rustup run nightly-2026-04-28 cargo public-api diff
      # SKIPPED: bloat is informational only and fails on workspace with deferred crates
      # run_logged target/supply-chain/bloat.log timeout 5m rustup run nightly-2026-04-28 cargo bloat --release --crates
    toolchains:
      - rust
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'cargo-vet.toml'
      - 'supply-chain/**/*'
      - '@globs(configs)'
    outputs:
      - 'target/supply-chain/**'
    options:
      runInCI: true

  feature-powerset:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      mkdir -p target/tmp
      flock --shared target/moon-locks/source-mutation.lock env TMPDIR="$PWD/target/tmp" RUSTC_WRAPPER= RUSTFLAGS="-Dwarnings" timeout 10m rustup run nightly-2026-04-28 cargo hack check --workspace --feature-powerset --depth 1 --exclude velvet-ballistics-fuzz --quiet
    deps:
      - 'check'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    options:
      runInCI: true

  miri:
    script: |
      set -euo pipefail
      mkdir -p target/miri-tmp
      mkdir -p target/moon-locks
      run_miri_smoke() {
        package="$1"
        filter="$2"
        TMPDIR="$PWD/target/miri-tmp" flock --shared target/moon-locks/source-mutation.lock env -u RUSTC_WRAPPER RUSTFLAGS="-Dwarnings" timeout 10m rustup run nightly-2026-04-28 cargo miri test --quiet -p "${package}" --lib --all-features "${filter}"
      }
      run_miri_smoke_integration() {
        package="$1"
        test_name="$2"
        filter="$3"
        TMPDIR="$PWD/target/miri-tmp" flock --shared target/moon-locks/source-mutation.lock env -u RUSTC_WRAPPER RUSTFLAGS="-Dwarnings" timeout 10m rustup run nightly-2026-04-28 cargo miri test --quiet -p "${package}" --all-features --test "${test_name}" -- "${filter}"
      }
      # CI policy: Miri is a bounded UB smoke lane for pure crates. The full
      # native test lane owns exhaustive behavior; sweeping all normal unit tests
      # under Miri exceeds the configured 30m automation budget.
      run_miri_smoke vb_core validate_action_outcome_failed_always_succeeds
      run_miri_smoke vb_expr miri_tests
      run_miri_smoke vb_compile compile_error_empty_source_code
      # Widen Miri coverage
      run_miri_smoke vb_storage codec_miri_tests
      run_miri_smoke vb_runtime miri_trace
      run_miri_smoke_integration vb_runtime vb_ko29_7_idempotency_miri miri_idempotency
      # Keep vb_ipc Miri scoped to pure frame validation; broader `frame`
      # also matches socket/client tests that need filesystem syscalls outside
      # Miri's default isolation contract.
      run_miri_smoke vb_ipc frame_validation
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      runInCI: true

  coverage:
    script: |
      set -euo pipefail
      mkdir -p target/llvm-cov
      mkdir -p target/moon-locks
      mkdir -p target/tmp
      # Smoke policy: full confidence comes from the test lane; CI coverage proves
      # llvm-cov wiring and report generation without re-running every test.
      flock --shared target/moon-locks/source-mutation.lock env TMPDIR="$PWD/target/tmp" RUSTC_WRAPPER= RUSTFLAGS="-Dwarnings" timeout 3m rustup run nightly-2026-04-28 cargo llvm-cov test --quiet --workspace --all-targets --all-features --lcov --output-path target/llvm-cov/lcov.info -- action::tests::validate_action_outcome_failed_always_succeeds
    deps:
      - 'check'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    outputs:
      - 'target/llvm-cov/**'
    options:
      runInCI: true

  mutants-smoke:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      mkdir -p target/tmp
      # Smoke policy: prove cargo-mutants integration on a bounded, deterministic
      # vb_core slice without mutating the source tree in place. Full mutation-score
      # debt is tracked separately.
      flock --shared target/moon-locks/source-mutation.lock env TMPDIR="$PWD/target/tmp" RUSTC_WRAPPER= timeout 10m rustup run nightly-2026-04-28 cargo mutants \
        --package vb_core \
        --file crates/vb_core/src/diagnostic.rs \
        --re 'is_supported_code -> bool with false' \
        --baseline skip \
        --jobs 1 \
        --gitignore true \
        --no-shuffle \
        --no-times \
        --timeout 60 \
        --minimum-test-timeout 2 \
        --output target/mutants-smoke \
        -- --lib diagnostic::
    deps:
      - 'check'
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/vb_core/Cargo.toml'
      - 'crates/vb_core/src/diagnostic.rs'
      - '.moon/tasks/all.yml'
    options:
      cache: false
      runInCI: true

  fuzz-smoke:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      mkdir -p target/fuzz-smoke
      if ! flock --shared target/moon-locks/source-mutation.lock env RUSTFLAGS="-Dwarnings" rustup run nightly-2026-04-28 cargo fuzz build --target x86_64-unknown-linux-gnu >target/fuzz-smoke/build.log 2>target/fuzz-smoke/build.err; then
        cat target/fuzz-smoke/build.log
        cat target/fuzz-smoke/build.err
        exit 1
      fi
      for fuzz_target in yaml_events ipc_frame journal_event_fuzz compiled_ir expression strict_yaml_profile storage_journal_roundtrip storage_journal_decode_reject storage_journal_kind_parity ipc_decode generated_compare structured_status_render_hostile vb_ui_model_postcard_decode xtask_parse_argv_hostile xtask_parse_options_hostile; do
        corpus_source="${fuzz_target}"
        if [ "${fuzz_target}" = "journal_event_fuzz" ]; then
          corpus_source="journal_event"
        fi
        if [ "${fuzz_target}" = "ipc_decode" ]; then
          corpus_source="ipc_frame"
        fi
        if [ "${fuzz_target}" = "strict_yaml_profile" ]; then
          corpus_source="yaml_events"
        fi
        if [ "${fuzz_target}" = "structured_status_render_hostile" ] || [ "${fuzz_target}" = "xtask_parse_argv_hostile" ] || [ "${fuzz_target}" = "xtask_parse_options_hostile" ]; then
          corpus_source="yaml_events"
        fi
        if [ "${fuzz_target}" = "vb_ui_model_postcard_decode" ]; then
          corpus_source="compiled_ir"
        fi
        if [ "${fuzz_target}" = "generated_compare" ]; then
          corpus_source="compiled_ir"
        fi
        corpus="target/fuzz-smoke/corpus/${fuzz_target}"
        artifacts="target/fuzz-smoke/artifacts/${fuzz_target}"
        rm -rf "${corpus}" "${artifacts}"
        mkdir -p "${corpus}" "${artifacts}"
        if [ -d "fuzz/corpus/${corpus_source}" ]; then
          cp -R "fuzz/corpus/${corpus_source}/." "${corpus}/"
        fi
        flock --shared target/moon-locks/source-mutation.lock timeout 30s "fuzz/target/x86_64-unknown-linux-gnu/release/${fuzz_target}" -artifact_prefix="${PWD}/${artifacts}/" -max_total_time=3 "${PWD}/${corpus}" >"target/fuzz-smoke/${fuzz_target}.log" 2>"target/fuzz-smoke/${fuzz_target}.err"
      done
    toolchains:
      - rust
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'fuzz/Cargo.toml'
      - 'fuzz/Cargo.lock'
      - 'fuzz/fuzz_targets.rs'
      - 'fuzz/fuzz_targets/**/*'
      - 'fuzz/src/**/*'
      - 'crates/vb_core/**/*'
      - 'crates/vb_yaml/**/*'
      - 'crates/vb_expr/**/*'
      - 'crates/vb_compile/**/*'
      - 'crates/vb_ipc/**/*'
      - 'crates/vb_storage/**/*'
    options:
      runInCI: true
    outputs:
      - 'target/fuzz-smoke/**'

  sanitizer-address-check:
    script: |
      set -euo pipefail
      RUSTFLAGS="-Zsanitizer=address" rustup run nightly-2026-04-28 cargo test -Zbuild-std --target x86_64-unknown-linux-gnu --workspace --all-targets --all-features
      mkdir -p target/sanitizer-address-check
      touch target/sanitizer-address-check/success.stamp
    deps:
      - 'check'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      runInCI: true
    outputs:
      - 'target/sanitizer-address-check/**'

  bench-build:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      mkdir -p target/tmp
      export CARGO_TARGET_DIR=target/bench-build
      flock --shared target/moon-locks/source-mutation.lock env TMPDIR="$PWD/target/tmp" RUSTC_WRAPPER= RUSTFLAGS="-Dwarnings" rustup run nightly-2026-04-28 cargo bench --quiet -p vb_core --bench aggregate_resource_budget --all-features
    deps:
      - 'check'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    outputs:
      - 'target/bench-build/release/deps/**'
    options:
      runInCI: true

  bench-expr-eval-micro-guard:
    # Per-bead vb-hxa55: registers expr_eval_micro as a moon ci regression
    # guard. Runs the bench once at fixed sample/warm-up/measurement times,
    # pipes criterion stdout to evidence/benchmark-logs/expr_eval_micro.log
    # and appends one benchmark-evidence.jsonl row sized N=1024 (the
    # canonical medium size) so benchmark-regression-policy can compare
    # against the recorded baseline. Fails (exit non-zero) on criterion
    # panic or non-zero cargo exit; does NOT itself compare — that is
    # benchmark-regression-policy's job.
    script: |
      mkdir -p evidence/benchmark-logs
      rustup run nightly-2026-04-28 cargo bench --quiet -p vb_core --bench expr_eval_micro --all-features -- --sample-size 10 --warm-up-time 1 --measurement-time 1 2>&1 | tee evidence/benchmark-logs/expr_eval_micro.log
    deps:
      - 'check'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
      - 'crates/vb_core/benches/expr_eval_micro.rs'
    outputs:
      - 'evidence/benchmark-logs/expr_eval_micro.log'
    options:
      runInCI: true

  bench-lru-ring-micro-guard:
    # Per-bead vb-hxa55: registers lru_ring_micro as a moon ci regression
    # guard. Same shape as bench-expr-eval-micro-guard but for the
    # vb_runtime lru_ring_micro bench at the canonical 100000-element
    # workload.
    script: |
      mkdir -p evidence/benchmark-logs
      rustup run nightly-2026-04-28 cargo bench --quiet -p vb_runtime --bench lru_ring_micro --all-features -- --sample-size 10 --warm-up-time 1 --measurement-time 1 2>&1 | tee evidence/benchmark-logs/lru_ring_micro.log
    deps:
      - 'check'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
      - 'crates/vb_runtime/benches/lru_ring_micro.rs'
    outputs:
      - 'evidence/benchmark-logs/lru_ring_micro.log'
    options:
      runInCI: true

  bench-regression-guards:
    # Per-bead vb-hxa55: aggregate gate that runs the new
    # expr_eval_micro + lru_ring_micro regression guards AND
    # the policy check against contracts/perf-budget.yaml. The
    # policy check fails closed if the new bench rows are
    # missing from evidence/benchmark-evidence.jsonl, so the
    # bench guard tasks above must have populated the rows.
    command: 'rustup run nightly-2026-04-28 cargo run --quiet -p xtask -- benchmark-regression-policy --budget contracts/perf-budget.yaml --evidence evidence/benchmark-evidence.jsonl'
    deps:
      - 'bench-expr-eval-micro-guard'
      - 'bench-lru-ring-micro-guard'
    toolchains:
      - rust
    inputs:
      - 'contracts/perf-budget.yaml'
      - 'evidence/benchmark-evidence.jsonl'
      - 'evidence/benchmark-logs/expr_eval_micro.log'
      - 'evidence/benchmark-logs/lru_ring_micro.log'
      - 'xtask/src/benchmark_policy.rs'
      - 'xtask/src/cli.rs'
      - 'xtask/src/main.rs'
      - '.moon/tasks/all.yml'
    options:
      runInCI: true

  benchmark-regression-policy:
    command: 'rustup run nightly-2026-04-28 cargo run --quiet -p xtask -- benchmark-regression-policy --budget contracts/perf-budget.yaml --evidence evidence/benchmark-evidence.jsonl'
    deps:
      - 'bench-build'
    toolchains:
      - rust
    inputs:
      - 'contracts/perf-budget.yaml'
      - 'evidence/benchmark-evidence.jsonl'
      - 'evidence/benchmark-logs/**/*'
      - 'xtask/src/benchmark_policy.rs'
      - 'xtask/src/cli.rs'
      - 'xtask/src/main.rs'
      - '.moon/tasks/all.yml'
    options:
      # xtask IS in workspace (Cargo.toml:21). Kept off-CI because the
      # policy check requires a populated evidence/benchmark-evidence.jsonl
      # which is only produced by the human nightly benchmark run; an
      # empty evidence file would yield a false-positive regression.
      # Re-admit to CI once the evidence path is auto-populated.
      runInCI: false

  benchmark-proof:
    # why: master §41 removed generated Rust / PGO / maxperf workflows as
    # current release gates. Saving a Criterion baseline is therefore not a
    # Backend / IR Interpreter Complete milestone requirement.
    command: 'rustup run nightly-2026-04-28 cargo bench --workspace --all-targets --all-features -- --save-baseline vb-current'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    outputs:
      - 'target/criterion/**'
    options:
      runInCI: false

  pgo-instrument-build:
    # why: master §41 removed PGO and the `maxperf` profile from current
    # release gates; the binary is built via the regular release lane and
    # the cargo `maxperf` profile in Cargo.toml is dormant.
    script: 'RUSTFLAGS="-Cprofile-generate=$PWD/target/pgo/profiles" rustup run nightly-2026-04-28 cargo build -p velvet-ballistics --bin velvet-ballistics --all-features --profile maxperf'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    outputs:
      - 'target/maxperf/**'
      - 'target/pgo/profiles/**'
    options:
      runInCI: false

  pgo-optimized-build:
    # why: master §41 removed PGO and the `maxperf` profile from current
    # release gates; the optimized PGO build is dormant and not a current
    # milestone requirement.
    script: 'RUSTFLAGS="-Cprofile-use=$PWD/target/pgo/merged.profdata -Cllvm-args=-pgo-warn-missing-function" rustup run nightly-2026-04-28 cargo build -p velvet-ballistics --bin velvet-ballistics --all-features --profile maxperf'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
      - 'target/pgo/merged.profdata'
    outputs:
      - 'target/maxperf/**'
    options:
      runInCI: false

  maxperf:
    # why: master §41 removed the `maxperf` profile and generated Rust
    # execution from current release gates; the release build runs in the
    # regular release lane and this dedicated `maxperf` target is dormant.
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      mkdir -p target/tmp
      export CARGO_TARGET_DIR=target/maxperf
      flock --shared target/moon-locks/source-mutation.lock env TMPDIR="$PWD/target/tmp" RUSTC_WRAPPER= RUSTFLAGS="-Dwarnings" rustup run nightly-2026-04-28 cargo build --quiet -p velvet-ballistics --bin velvet-ballistics --all-features --release
    deps:
      - 'test'
      - 'lint-src'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    outputs:
      - 'target/maxperf/release/**'
    options:
      runInCI: false

  maxperf-native:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      mkdir -p target/tmp
      export CARGO_TARGET_DIR=target/maxperf-native
      # allow-removed-feature: master §41 — maxperf-native is legacy build config, not a current release gate (runInCI: false)
      export RUSTFLAGS="-C target-cpu=native -Dwarnings"
      flock --shared target/moon-locks/source-mutation.lock env TMPDIR="$PWD/target/tmp" RUSTC_WRAPPER= rustup run nightly-2026-04-28 cargo build --quiet -p velvet-ballistics --bin velvet-ballistics --all-features --release
    deps:
      - 'test'
      - 'lint-src'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    outputs:
      - 'target/maxperf-native/release/**'
    options:
      runInCI: false

  verify-fast:
    # why: developer-only deep verification gauntlet (rust-verification-gauntlet.sh
    # fast/standard/deep/proof/all); the canonical CI evidence is the per-tool
    # `verify-kani*`, `verify-verus*`, `verify-tlc*`, and `loom-*` tasks that
    # are owned by their respective beads. The fast lane is the smallest local
    # catch-all and is not a release gate.
    command: 'bash scripts/rust-verification-gauntlet.sh fast'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
      - '@globs(proofs)'
    options:
      cache: false
      runInCI: false

  verify-standard:
    # why: developer-only deep verification gauntlet (see verify-fast for the
    # rationale); `standard` is a longer local pass that overlaps the
    # per-tool `verify-kani*` / `verify-verus*` / `verify-tlc*` / `loom-*`
    # tasks that are owned by their respective beads.
    command: 'bash scripts/rust-verification-gauntlet.sh standard'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
      - '@globs(proofs)'
    options:
      cache: false
      runInCI: false

  verify-deep:
    # why: developer-only deep verification gauntlet (see verify-fast for the
    # rationale); `deep` is the longest local pass that overlaps the
    # per-tool `verify-kani*` / `verify-verus*` / `verify-tlc*` / `loom-*`
    # tasks that are owned by their respective beads.
    command: 'bash scripts/rust-verification-gauntlet.sh deep'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
      - '@globs(proofs)'
    options:
      cache: false
      runInCI: false

  check-stepstate-matrix:
    command: 'bash scripts/check-stepstate-matrix.sh'
    toolchains:
      - rust
    inputs:
      - 'scripts/check-stepstate-matrix.sh'
      - 'crates/vb_proof_kernels/src/step_state/**/*.rs'
    options:
      cache: false
      runInCI: true

  verify-proof:
    # why: developer-only deep verification gauntlet (see verify-fast for the
    # rationale); `proof` is a long-running local pass that overlaps the
    # per-tool `verify-kani*` / `verify-verus*` / `verify-tlc*` / `loom-*`
    # tasks that are owned by their respective beads.
    command: 'bash scripts/rust-verification-gauntlet.sh proof'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
      - '@globs(proofs)'
    options:
      cache: false
      runInCI: false

  verify-all:
    # why: developer-only deep verification gauntlet (see verify-fast for the
    # rationale); `all` is the longest local pass and requires an explicit
    # ALLOW_BEAD_LOCKBUD_WAIVER environment variable, so it can never be a
    # default CI lane.
    command: 'env VERIFY_BEAD_ID=vb-nf2u ALLOW_BEAD_LOCKBUD_WAIVER=1 bash scripts/rust-verification-gauntlet.sh all'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
      - '@globs(proofs)'
    options:
      cache: false
      runInCI: false

  contracts:
    command: 'cargo xtask contracts --check'
    toolchains:
      - rust
    inputs:
      - 'contracts/**/*'
      - '.cargo/config.toml'
      - '.moon/tasks/all.yml'
    options:
      # xtask IS in workspace (Cargo.toml:21). Kept off-CI deliberately:
      # contracts check is a developer-time artifact gate that emits
      # warnings rather than binary failures; the canonical contracts
      # enforcement lives in `contract-shape` (Cargo-level compile
      # check) and `lint-src` (clippy on regenerated artifacts). Re-admit
      # to CI only after contracts become a binary gate.
      runInCI: false

  quick:
    # why: developer-only short pipeline (fmt + lint-src + check +
    # nightly-feature-gate) used as a fast pre-push local sanity check.
    # The canonical CI pipeline is `moon ci`; running `quick` from CI would
    # duplicate the per-tool tasks and slow the lane down.
    script: |
      moon run :fmt
      moon run :lint-src
      moon run :check
      moon run :nightly-feature-gate
    options:
      runInCI: false
