fileGroups:
  sources:
    - 'Cargo.toml'
    - 'Cargo.lock'
    - 'rust-toolchain.toml'
    - 'src/**/*'
    - 'crates/**/*'
    - 'benches/**/*'
    - 'examples/**/*'
    - 'build.rs'
  tests:
    - 'tests/**/*'
    - 'fuzz/**/*'
  configs:
    - '.cargo/**/*'
    - '.github/**/*'
    - '.moon/**/*'
    - '.config/**/*'
    - 'deny.toml'
    - 'cargo-vet.toml'
    - 'justfile'
    - 'scripts/**/*'
  docs:
    - 'README.md'
    - 'docs/**/*'

tasks:
  fmt:
    command: 'rustup run nightly-2026-04-28 cargo fmt --all --check'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      runInCI: true

  lint-src:
    command: 'rustup run nightly-2026-04-28 cargo clippy --workspace --lib --bins --examples --all-features -- -D warnings -W clippy::all -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic -D clippy::todo -D clippy::unimplemented -D clippy::dbg_macro -D clippy::print_stdout -D clippy::print_stderr'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    options:
      runInCI: true

  check:
    command: 'rustup run nightly-2026-04-28 cargo check --workspace --all-targets --all-features'
    deps:
      - 'nightly-feature-gate'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      runInCI: true

  nightly-feature-gate:
    command: 'bash scripts/check-nightly-features.sh'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      runInCI: true

  nightly-feature-cargo-probe:
    script: 'rustup run nightly-2026-04-28 cargo -Zallow-features=try_blocks,portable_simd,allocator_api,generic_const_exprs check --workspace --all-targets --all-features'
    deps:
      - 'nightly-feature-gate'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      runInCI: true

  source-length:
    command: 'bash scripts/check-source-length.sh'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      runInCI: true

  hardened-build:
    command: 'env RUSTC_WRAPPER= CARGO_TARGET_DIR=target/hardened-build rustup run nightly-2026-04-28 cargo build --workspace --all-features --profile hardened'
    deps:
      - 'check'
      - 'lint-src'
      - 'source-length'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    outputs:
      - 'target/hardened-build/hardened/**'
    options:
      cache: false
      runInCI: true

  test:
    command: 'rustup run nightly-2026-04-28 cargo nextest run --workspace --all-features'
    deps:
      - 'check'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      runInCI: true

  doc-test:
    command: 'rustup run nightly-2026-04-28 cargo test --doc --workspace --all-features'
    deps:
      - 'check'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    options:
      runInCI: true

  doc:
    command: 'rustup run nightly-2026-04-28 cargo doc --workspace --all-features --no-deps'
    deps:
      - 'check'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
      - '@globs(docs)'
    outputs:
      - 'target/doc/**'
    options:
      runInCI: true

  supply-chain:
    script: |
      set -euo pipefail
      rustup run nightly-2026-04-28 cargo audit
      rustup run nightly-2026-04-28 cargo deny check
      rustup run nightly-2026-04-28 cargo vet --store-path supply-chain --locked
      # Geiger is reporting-only: first-party unsafe is forbidden by workspace
      # lints; transitive unsafe remains visible here and governed by vet/deny.
      for package in vb_codegen vb_compile vb_core vb_expr vb_ipc vb_runtime vb_storage vb_validate vb_yaml velvet-ballastics velvet-ballastics-fuzz; do
        rustup run nightly-2026-04-28 cargo geiger -p "$package" --all-features --all-dependencies --include-tests --output-format GitHubMarkdown
      done
      rustup run nightly-2026-04-28 cargo machete --skip-target-dir crates/vb_codegen crates/vb_compile crates/vb_core crates/vb_expr crates/vb_ipc crates/vb_runtime crates/vb_storage crates/vb_validate crates/vb_yaml crates/velvet_ballastics fuzz
    toolchains:
      - rust
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'cargo-vet.toml'
      - 'supply-chain/**/*'
      - '@globs(configs)'
    options:
      runInCI: true

  feature-powerset:
    command: 'rustup run nightly-2026-04-28 cargo hack check --workspace --feature-powerset --no-dev-deps'
    deps:
      - 'check'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    options:
      runInCI: true

  miri:
    command: 'rustup run nightly-2026-04-28 cargo miri test -p vb_core -p vb_expr -p vb_compile --all-features'
    deps:
      - 'check'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      runInCI: true

  coverage:
    command: 'rustup run nightly-2026-04-28 cargo llvm-cov nextest --workspace --all-features --lcov --output-path target/llvm-cov/lcov.info'
    deps:
      - 'test'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    outputs:
      - 'target/llvm-cov/**'
    options:
      runInCI: true

  mutants-smoke:
    command: 'rustup run nightly-2026-04-28 cargo mutants --package vb_core --no-shuffle --timeout 60 --in-place --minimum-test-timeout 10'
    deps:
      - 'test'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      runInCI: true

  fuzz-smoke:
    command: 'rustup run nightly-2026-04-28 cargo build -p velvet-ballastics-fuzz --bins --features fuzz --locked'
    toolchains:
      - rust
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'fuzz/**/*'
      - 'crates/vb_core/**/*'
      - 'crates/vb_yaml/**/*'
      - 'crates/vb_expr/**/*'
      - 'crates/vb_compile/**/*'
      - 'crates/vb_codegen/**/*'
      - 'crates/vb_ipc/**/*'
      - 'crates/vb_storage/**/*'
    options:
      runInCI: true

  sanitizer-address-check:
    script: 'RUSTFLAGS="-Zsanitizer=address" rustup run nightly-2026-04-28 cargo test -Zbuild-std --target x86_64-unknown-linux-gnu --workspace --all-features --no-run'
    deps:
      - 'check'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      runInCI: false

  bench-build:
    command: 'rustup run nightly-2026-04-28 cargo bench --workspace --all-features --no-run'
    deps:
      - 'check'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    outputs:
      - 'target/release/deps/**'
    options:
      runInCI: true

  benchmark-proof:
    command: 'rustup run nightly-2026-04-28 cargo bench --workspace --all-features -- --save-baseline vb-current'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    outputs:
      - 'target/criterion/**'
    options:
      runInCI: false

  pgo-instrument-build:
    script: 'RUSTFLAGS="-Cprofile-generate=target/pgo/profiles" rustup run nightly-2026-04-28 cargo build --workspace --all-features --profile maxperf'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    outputs:
      - 'target/maxperf/**'
      - 'target/pgo/profiles/**'
    options:
      runInCI: false

  pgo-optimized-build:
    script: 'RUSTFLAGS="-Cprofile-use=target/pgo/merged.profdata" rustup run nightly-2026-04-28 cargo build --workspace --all-features --profile maxperf'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
      - 'target/pgo/merged.profdata'
    outputs:
      - 'target/maxperf/**'
    options:
      runInCI: false

  maxperf:
    command: 'rustup run nightly-2026-04-28 cargo build --workspace --all-features --release'
    deps:
      - 'check'
      - 'lint-src'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    outputs:
      - 'target/release/**'
    options:
      runInCI: true

  maxperf-native:
    script: |
      export RUSTFLAGS="-C target-cpu=native"
      rustup run nightly-2026-04-28 cargo build --workspace --all-features --release
    deps:
      - 'check'
      - 'lint-src'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    outputs:
      - 'target/release/**'
    options:
      runInCI: true

  quick:
    script: |
      moon run :fmt
      moon run :lint-src
      moon run :check
      moon run :nightly-feature-gate
    options:
      runInCI: false
