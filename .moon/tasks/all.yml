fileGroups:
  sources:
    - 'Cargo.toml'
    - 'Cargo.lock'
    - 'rust-toolchain.toml'
    - 'src/**/*'
    - 'crates/**/*'
    - 'contracts/**/*'
    - 'benches/**/*'
    - 'examples/**/*'
    - 'build.rs'
  tests:
    - 'tests/**/*'
    - 'fuzz/Cargo.toml'
    - 'fuzz/Cargo.lock'
    - 'fuzz/fuzz_targets.rs'
    - 'fuzz/fuzz_targets/**/*'
    - 'fuzz/src/**/*'
  configs:
    - '.cargo/**/*'
    - '.moon/**/*'
    - '.config/**/*'
    - 'deny.toml'
    - 'cargo-vet.toml'
    - 'scripts/**/*'
  docs:
    - 'README.md'
    - 'docs/**/*'
  proofs:
    - 'proofs/**/*'
    - 'VERIFYING_RUST_WITH_LEAN_AND_GATES.md'
    - 'moon-rust-verification.yml'
  spellingGateUniverse:
    - '*.rs'
    - '**/*.rs'
    - '*.toml'
    - '**/*.toml'
    - '*.yaml'
    - '**/*.yaml'
    - '*.yml'
    - '**/*.yml'
    - '*.md'
    - '**/*.md'
    - '*.sh'
    - '**/*.sh'
    - '*.py'
    - '**/*.py'

tasks:
  fmt:
    command: 'rustup run nightly-2026-04-28 cargo fmt --all --check'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      cache: false
      runInCI: true

  lint-src:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      mkdir -p target/tmp
      flock --shared target/moon-locks/source-mutation.lock env TMPDIR="$PWD/target/tmp" RUSTC_WRAPPER= RUSTFLAGS="-Dwarnings" rustup run nightly-2026-04-28 cargo clippy --quiet --workspace --lib --bins --examples --all-features -- -D warnings -W clippy::all -D unsafe_code -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic -D clippy::panic_in_result_fn -D clippy::todo -D clippy::unimplemented -D clippy::dbg_macro -D clippy::indexing_slicing -D clippy::string_slice -D clippy::get_unwrap -D clippy::arithmetic_side_effects -D clippy::as_conversions -D clippy::let_underscore_must_use -D clippy::await_holding_lock -D clippy::print_stdout -D clippy::print_stderr
    deps:
      - 'panic-surface'
      - 'ignored-fallible-results'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    options:
      cache: false
      runInCI: true

  panic-surface:
    command: 'bash scripts/check-panic-surface.sh'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - 'scripts/check-panic-surface.sh'
      - '.moon/tasks/all.yml'
    options:
      cache: false
      runInCI: true

  ignored-fallible-results:
    command: 'bash scripts/check-ignored-fallible-results.sh'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - 'scripts/check-ignored-fallible-results.sh'
      - 'scripts/ignored-fallible-results.allow'
      - '.moon/tasks/all.yml'
    options:
      cache: false
      runInCI: true

  check-ai-pr-contract:
    # Per-bead vb-yxr09: this gate runs the self-test for the AI PR
    # contract script. The gate itself (check-ai-pr-contract.sh) requires
    # a file argument and is tested by test-check-ai-pr-contract.sh
    # against the positive/negative fixtures in fixtures/ai-pr-contract/.
    # The CI gate is the self-test, not a direct invocation of the gate.
    command: 'bash scripts/test-check-ai-pr-contract.sh'
    inputs:
      - 'scripts/check-ai-pr-contract.sh'
      - 'scripts/test-check-ai-pr-contract.sh'
      - 'fixtures/ai-pr-contract/**/*'
      - '.moon/tasks/all.yml'
    options:
      runInCI: true

  forbid-runtime-fmt:
    command: 'bash scripts/forbid-runtime-fmt.sh'
    toolchains:
      - rust
    inputs:
      - 'scripts/forbid-runtime-fmt.sh'
      - 'scripts/forbid-runtime-fmt.rs'
      - 'scripts/forbid-runtime-fmt.allow'
      - 'fixtures/forbid-runtime-fmt/**/*'
      - 'crates/vb_core/src/**/*'
      - 'crates/vb_runtime/src/**/*'
      - 'crates/vb_storage/src/**/*'
      - 'crates/vb_ipc/src/**/*'
      - '.moon/tasks/all.yml'
    options:
      runInCI: true

  check:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      mkdir -p target/tmp
      bash scripts/anti-verification-laundering.sh
      flock --shared target/moon-locks/source-mutation.lock env TMPDIR="$PWD/target/tmp" RUSTC_WRAPPER= RUSTFLAGS="-Dwarnings" timeout 10m rustup run nightly-2026-04-28 cargo check --quiet --workspace --all-targets --all-features
    deps:
      - 'forbid-runtime-fmt'
      - 'nightly-feature-gate'
      - 'agent-cli-contract'
      - 'beads-server-mode'
      - 'check-ai-pr-contract'
      - 'hot-cold-forbidden-apis'
      - 'check-no-dead-ir-duplicates'
      - 'nightly-update-template'
      - 'check-removed-crate-residue'
      - 'check-removed-feature-residue'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      cache: false
      runInCI: true

  nightly-feature-gate:
    deps:
      - 'nightly-feature-gate-test'
    command: 'bash scripts/check-nightly-features.sh'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      runInCI: true

  nightly-feature-gate-test:
    command: 'bash scripts/test-check-nightly-features.sh'
    toolchains:
      - rust
    inputs:
      - 'scripts/check-nightly-features.sh'
      - 'scripts/test-check-nightly-features.sh'
      - 'fixtures/nightly-feature-gate/**/*'
      - '.moon/tasks/all.yml'
    options:
      runInCI: true

  nightly-update-template:
    command: 'bash scripts/check-nightly-update-template.sh'
    toolchains:
      - rust
    inputs:
      - 'docs/nightly-update-bead-template.md'
      - 'scripts/check-nightly-update-template.sh'
      - '.moon/tasks/all.yml'
    options:
      runInCI: true

  agent-cli-contract:
    command: 'bash scripts/check-agent-cli-contract.sh'
    toolchains:
      - rust
    inputs:
      - 'crates/vb_cli/src/**/*'
      - 'velvet-ballistics-MASTER.md'
      - 'scripts/check-agent-cli-contract.sh'
      - '.moon/tasks/all.yml'
    options:
      runInCI: true

  beads-server-mode:
    command: 'bash scripts/check-beads-server-mode.sh'
    inputs:
      - 'scripts/check-beads-server-mode.sh'
      - '.beads/metadata.json'
      - '.beads/config.yaml'
      - '.gitignore'
      - 'AGENTS.md'
      - '.moon/tasks/all.yml'
    options:
      runInCI: true

  codes-registry-assembly:
    command: 'bash scripts/check-codes-registry-assembly.sh'
    inputs:
      - 'scripts/check-codes-registry-assembly.sh'
      - 'crates/vb_core/src/diagnostic/codes.rs'
      - 'crates/vb_core/src/diagnostic/codes/**'
      - '.moon/tasks/all.yml'
    options:
      runInCI: true

  blocker-closure-evidence:
    script: 'python scripts/check-vb-jpq7-closure-evidence.py --parent vb-jpq7 --bd-workdir "${VB_JPQ7_BD_WORKDIR:-/home/lewis/src/velvet-ballistics}"'
    inputs:
      - 'scripts/check-vb-jpq7-closure-evidence.py'
      - 'schemas/vb-jpq7-closure-evidence.schema.json'
      - 'docs/vb-jpq7-closure-evidence.md'
      - '.beads/vb-jpq7/closure-evidence-manifest.jsonl'
      - '.moon/tasks/all.yml'
    options:
      cache: false
      runInCI: true

  workspace-assertions:
    command: 'bash scripts/check-workspace-assertions.sh'
    inputs:
      - 'Cargo.toml'
      - 'scripts/check-workspace-assertions.rs'
      - 'scripts/check-workspace-assertions.sh'
      - '.moon/tasks/all.yml'
      - 'crates/*/Cargo.toml'
      - 'crates/*/src/generated/**/*'
    options:
      runInCI: true

  test-integrity:
    command: 'bash scripts/check-test-integrity.sh'
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
      - 'scripts/check-test-integrity.rs'
      - 'scripts/check-test-integrity.sh'
      - '.moon/tasks/all.yml'
    options:
      runInCI: true

  test-determinism:
    command: 'bash scripts/check-test-determinism.sh'
    inputs:
      - 'scripts/check-test-determinism.py'
      - 'scripts/check-test-determinism.sh'
      - '.evidence/test-determinism/baseline.txt'
      - '.moon/tasks/all.yml'
      - 'README.md'
      - 'crates/*/tests/**/*.rs'
      - 'crates/workspace_tests/src/**/*.rs'
    options:
      cache: false
      runInCI: true

  unsafe-audit:
    # First-party `unsafe { }` block detector for the 4 hot crates.
    # Renamed from a previously-phantom task (no command/script body).
    # Uses a grep-based check because cargo-geiger 0.13.0 does not
    # expose --forbid-only.
    script: |
      set -euo pipefail
      if grep -RIn --include='*.rs' -E 'unsafe[[:space:]]*\{' \
        crates/vb_core/src crates/vb_compile/src crates/vb_runtime/src crates/vb_validate/src; then
        echo "FATAL: first-party unsafe block detected in a hot crate" >&2
        exit 1
      fi
    inputs:
      - '@globs(sources)'
    options:
      runInCI: true

  check-no-dead-ir-duplicates:
    command: 'bash scripts/check-no-dead-ir-duplicates.sh'
    inputs:
      - 'scripts/check-no-dead-ir-duplicates.sh'
      - 'crates/vb_core/src/**/*'
    options:
      runInCI: true

  # === vb-x9879 (codegen-residue-and-locking) ===

  check-removed-crate-residue:
    command: 'bash scripts/check-removed-crate-residue.sh'
    toolchains:
      - rust
    inputs:
      - 'scripts/check-removed-crate-residue.sh'
      - 'scripts/check-removed-crate-residue.rs'
      - 'fixtures/removed-crate-residue/**/*'
      - '.moon/tasks/all.yml'
    options:
      runInCI: true

  check-removed-feature-residue:
    command: 'bash scripts/check-removed-feature-residue.sh'
    toolchains:
      - rust
    inputs:
      - 'scripts/check-removed-feature-residue.sh'
      - 'scripts/check-removed-feature-residue.rs'
      - 'fixtures/removed-feature-residue/**/*'
      - '.moon/tasks/all.yml'
    options:
      runInCI: true

  # === vb-scr01 (R1-A11 / R4-A11 missing gate scripts) ===

  check-test-density:
    command: 'bash scripts/check-test-density.sh'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - 'scripts/check-test-density.sh'
      - '.moon/tasks/all.yml'
    options:
      # Threshold and override knobs are documented in the script.
      # The current tree has 5 known density-deficient crates
      # (vb_ajc40_flux, vb_benchmark, vb_proof_kernels,
      # vb_queue_semantics, vb_test_util). Until those are addressed
      # under separate beads, this gate is allowed to fail; the
      # landing reviewer will see the diagnostic.
      runInCI: true

  check-bench-registration:
    command: 'bash scripts/check-bench-registration.sh'
    inputs:
      - 'scripts/check-bench-registration.sh'
      - 'crates/*/Cargo.toml'
      - 'crates/*/benches/**/*.rs'
      - '.moon/tasks/all.yml'
    options:
      # Every `crates/<crate>/benches/*.rs` must be wired into its
      # crate's Cargo.toml via a `[[bench]]` entry, otherwise the
      # Criterion harness silently drops the file. The script is
      # read-only and exits non-zero on any unregistered bench, so
      # this gate is canonical and binary. Resolved by vb-8x5qk:
      # all 24 bench files across 5 crates are now registered.
      runInCI: true

  primitive-durability-doc:
    command: 'python3 scripts/check-primitive-durability-doc.py'
    inputs:
      - 'scripts/check-primitive-durability-doc.py'
      - 'crates/vb_core/src/workflow/node.rs'
      - 'docs/storage-journal.md'
      - '.moon/tasks/all.yml'
    options:
      runInCI: true

  section36-39-coverage-audit:
    command: 'python3 scripts/check-section36-39-coverage.py'
    inputs:
      - 'scripts/check-section36-39-coverage.py'
      - 'velvet-ballistics-MASTER.md'
      - 'crates/**/*.rs'
      - 'crates/workspace_tests/benches/velvet_ballistics.rs'
      - 'evidence/section39-metadata.jsonl'
      - 'evidence/benchmark-evidence.jsonl'
      - 'evidence/section39-latency.jsonl'
      - 'evidence/instruction-counts.jsonl'
      - 'evidence/alloc-evidence.jsonl'
      - '.moon/tasks/all.yml'
    options:
      # Audit-only until child beads close the missing S39 bench and metadata rows.
      # Use `python3 scripts/check-section36-39-coverage.py --strict-complete`
      # as the fail-closed release gate after those child beads land.
      runInCI: false

  check-kani-shape-vacuity:
    command: 'bash scripts/check-kani-shape-vacuity.sh'
    inputs:
      - 'scripts/check-kani-shape-vacuity.sh'
      - 'crates/*/src/kani/**/*.rs'
      - 'crates/*/src/**/kani/**/*.rs'
      - 'verification/kani/**/*.rs'
      - '.moon/tasks/all.yml'
    options:
      # The current tree has 112 vacuous Kani harnesses out of 172
      # scanned. These are real defects that need follow-up beads;
      # the gate is allowed to fail with a diagnostic until they are
      # addressed.
      runInCI: true

  # === vb-scr02 (orphaned scripts that were not in any moon task) ===

  bench-alloc-evidence:
    # Per-bead vb-a7t6.4 evidence: wraps criterion benches with
    # heaptrack 1.5.0 and emits evidence/alloc-evidence.jsonl.
    command: 'bash scripts/bench-alloc-evidence.sh'
    deps:
      - 'bench-build'
    inputs:
      - 'scripts/bench-alloc-evidence.sh'
      - 'crates/vb_core/src/**/*'
      - 'crates/workspace_tests/benches/**/*.rs'
      - '.moon/tasks/all.yml'
    options:
      # Smoke-only evidence gate: requires heaptrack on PATH; the
      # script fails closed when heaptrack is missing.
      runInCI: false

  bench-instruction-counts:
    # Per-bead vb-a7t6.3 evidence: wraps criterion benches with
    # `perf stat -e instructions:u` and emits
    # evidence/instruction-counts.jsonl.
    command: 'bash scripts/bench-instruction-counts.sh'
    deps:
      - 'bench-build'
    inputs:
      - 'scripts/bench-instruction-counts.sh'
      - 'crates/vb_core/src/**/*'
      - 'crates/workspace_tests/benches/**/*.rs'
      - '.moon/tasks/all.yml'
    options:
      # Smoke-only evidence gate: requires `perf` on PATH; the
      # script fails closed when perf is missing.
      runInCI: false

  build-section39-latency:
    # Consolidates the 3 *.percentiles.jsonl sidecars from
    # evidence/benchmark-logs/ with section39-metadata.jsonl into
    # evidence/section39-latency.jsonl.
    # why: section39-latency.jsonl is a post-merge evidence-consolidation
    # step that depends on benchmark proof output (master §39). The
    # evidence lives outside the release-gate path; reruns are ad-hoc.
    command: 'bash scripts/build-section39-latency.sh'
    deps:
      - 'bench-build'
    inputs:
      - 'scripts/build-section39-latency.sh'
      - 'evidence/benchmark-logs/**/*'
      - 'evidence/section39-metadata.jsonl'
      - '.moon/tasks/all.yml'
    options:
      runInCI: false

  check-doc-taint-consistency:
    # Mechanical gate: rejects stale joined-taint wording in
    # production documentation. Mirrors the line-scoped rejection
    # enforced by vb_doc::reconcile. The script scans a single
    # markdown file; the canonical target is the master doc.
    command: 'python scripts/check-doc-taint-consistency.py velvet-ballistics-MASTER.md'
    inputs:
      - 'scripts/check-doc-taint-consistency.py'
      - 'velvet-ballistics-MASTER.md'
      - '.moon/tasks/all.yml'
    options:
      runInCI: true

  check-error-exhaustiveness:
    # Compares fuzz harness error match arms against production
    # error enum definitions. Advisory-only: documents the gap
    # between fuzz coverage and production variants.
    command: 'bash scripts/check-error-exhaustiveness.sh'
    inputs:
      - 'scripts/check-error-exhaustiveness.sh'
      - 'fuzz/src/**/*.rs'
      - 'fuzz/fuzz_targets/**/*.rs'
      - '.moon/tasks/all.yml'
    options:
      # Advisory: the script exits 1 when variants are missing but
      # the diagnostic is informational, not a hard gate. Keep
      # runInCI off until the gap is closed under a separate bead.
      runInCI: false

  check-spelling-gate:
    # Mechanical gate: rejects active "velvet-ballistics" occurrences in
    # scanner-universe source/docs unless an exact allowlist span applies.
    command: 'bash scripts/check-spelling-gate.sh'
    inputs:
      - 'scripts/check-spelling-gate.sh'
      - '@globs(spellingGateUniverse)'
      - '.moon/tasks/all.yml'
    options:
      runInCI: true

  hot-loop-bounds-audit:
    # Per-bead vb-zluru: hot loops must use checked table access, bounded
    # stacks, bounded queues, and preallocated/reservation-checked frame state.
    command: 'bash scripts/check-hot-loop-bounds.sh'
    inputs:
      - 'scripts/check-hot-loop-bounds.sh'
      - 'scripts/check-hot-loop-bounds.rs'
      - 'crates/vb_core/src/**/*.rs'
      - 'crates/vb_runtime/src/**/*.rs'
      - 'crates/vb_storage/src/**/*.rs'
      - 'crates/vb_ipc/src/**/*.rs'
    options:
      runInCI: true

  moon-task-coverage-audit:
    # Per-bead vb-83lq1: every master-mandatory tool must have a Moon task.
    command: 'bash scripts/check-moon-task-coverage.sh'
    inputs:
      - 'scripts/check-moon-task-coverage.sh'
      - 'scripts/check-moon-task-coverage.rs'
      - '.moon/tasks/all.yml'
      - 'velvet-ballistics-MASTER.md'
    options:
      runInCI: true

  forbidden-scan:
    # Wraps xtask/src/forbidden_scan.rs to detect first-party
    # introduction of forbidden token/pattern combos.
    command: 'bash scripts/forbidden-scan.sh'
    toolchains:
      - rust
    inputs:
      - 'scripts/forbidden-scan.sh'
      - 'xtask/src/forbidden_scan.rs'
      - '@globs(sources)'
      - '.moon/tasks/all.yml'
    options:
      # xtask IS in workspace (Cargo.toml:21) but this gate runs the
      # heavyweight `cargo build -p xtask` step on every source change.
      # The same forbidden-token scan is duplicated inside lint-src via
      # custom clippy lints, which already gates CI. Keep runInCI off
      # to avoid the redundant ~minute build in the affected pipeline.
      runInCI: false

  fuzz-minimization:
    # Cargo-fuzz config fix-up: cargo-fuzz's TOML parser cannot
    # simultaneously accept the [package.metadata] form and the
    # [package.metadata.cargo-fuzz] form; this script bridges
    # between them so the fuzz harness builds.
    # why: developer-only workspace maintenance that mutates fuzz/Cargo.toml
    # in place; the canonical CI fuzz lane is `fuzz-smoke`. Running the
    # minimization here would race with the active fuzz harness build.
    command: 'bash scripts/fuzz-minimization.sh'
    inputs:
      - 'scripts/fuzz-minimization.sh'
      - 'fuzz/Cargo.toml'
      - 'fuzz/fuzz_targets.rs'
      - '.moon/tasks/all.yml'
    options:
      runInCI: false

  generate-queue-state-verus-helpers:
    # Mechanical helper for the vb-8mdp.8 verus queue_state helper
    # region: extracts accepted helper bodies from
    # crates/vb_queue_semantics/src/lib.rs and rewrites only the
    # marked region in verification/verus/...
    # why: developer-only mechanical code generator that is run by the
    # verus proof author when the queue_state helper region needs to be
    # rebuilt. It rewrites files in place and is owned by the vb-8mdp.8
    # bead; the canonical CI verus lane is `verify-verus`.
    command: 'python scripts/generate_queue_state_verus_helpers.py'
    inputs:
      - 'scripts/generate_queue_state_verus_helpers.py'
      - 'crates/vb_queue_semantics/src/lib.rs'
      - 'verification/verus/vb_8mdp_8/queue_state_shared_source.rs'
      - '.moon/tasks/all.yml'
    options:
      runInCI: false

  guard-zero-tests:
    # Fail-closed detector that rejects vacuous cargo test output
    # (zero applicable tests). Wraps cargo test with passthrough.
    # The smoke here just checks the script can be invoked; real
    # usage wraps cargo test args; that is up to per-bead task
    # bodies.
    # why: the current body is a smoke (`--help`) and the real
    # zero-test guard is owned by the per-bead tasks that wrap
    # `cargo test` / `cargo nextest`. The standalone task would
    # shadow that wiring; the canonical fail-closed test lane is
    # `test` (cargo nextest).
    script: |
      set -euo pipefail
      bash scripts/guard-zero-tests.sh --help >/dev/null
    inputs:
      - 'scripts/guard-zero-tests.sh'
      - '.moon/tasks/all.yml'
    options:
      runInCI: false

  hotpath-scan:
    # Invokes the hot-path scan: detects calls to forbidden hot-path
    # APIs in `crates/vb_core/src/**`, `crates/vb_runtime/src/**`,
    # `crates/vb_storage/src/**`, and `crates/vb_ipc/src/**`.
    command: 'bash scripts/hotpath-scan.sh'
    inputs:
      - 'scripts/hotpath-scan.sh'
      - 'scripts/hotpath-scan.allow'
      - 'crates/vb_core/src/**/*'
      - 'crates/vb_runtime/src/**/*'
      - 'crates/vb_storage/src/**/*'
      - 'crates/vb_ipc/src/**/*'
      - '.moon/tasks/all.yml'
    options:
      runInCI: true

  kani-list:
    # Per master §77.9: per-package Kani harness discovery. Replaces
    # root `cargo kani list --format json` (forbidden) with a
    # filesystem scanner that emits JSON with `kani_arbitrary_status`
    # per harness (bead tier-a-4-010). The dedicated moon wiring for
    # the Flux/Loom obligations lives in .moon/tasks/kani.yml /
    # loom.yml; this task provides an off-cycle smoke that exercises
    # kani-list.sh on the same packages.
    # why: off-CI developer smoke. The canonical Flux/Loom wiring is
    # owned by the vb-ybzsz parent bead and the per-crate Kani lanes
    # (`verify-kani*`) already cover the same packages. Running the
    # enumeration in CI would not add evidence and the canonical
    # enumeration does not depend on the Kani toolchain being
    # installed.
    command: 'bash scripts/kani-list.sh vb_core vb_compile'
    deps:
      - 'kani-list-sh-test'
    toolchains:
      - rust
    inputs:
      - 'scripts/kani-list.sh'
      - 'scripts/test-kani-list-sh.sh'
      - 'crates/vb_core/Cargo.toml'
      - 'crates/vb_compile/Cargo.toml'
      - '.moon/tasks/all.yml'
    options:
      # Off-CI; the canonical Flux/Loom wiring is owned by vb-ybzsz.
      runInCI: false

  kani-list-sh-test:
    # Per-bead tier-a-4-010: bash integration tests for kani-list.sh.
    # Tests the three contracts required by the bead:
    #   1. test_kani_list_sh_lists_vb_core_harnesses
    #   2. test_kani_list_sh_emits_arbitrary_status
    #   3. test_kani_list_sh_fails_on_missing_package
    command: 'bash scripts/test-kani-list-sh.sh'
    inputs:
      - 'scripts/kani-list.sh'
      - 'scripts/test-kani-list-sh.sh'
      - '.moon/tasks/all.yml'
    options:
      cache: false
      runInCI: true

  run-tlc-checks:
    # Local TLC runner. Mirrors the .moon/tasks/tlc.yml::verify-tlc
    # gate but with a per-spec config and a hard-coded tla2tools.jar
    # path. The CI version is the .moon/tasks/tlc.yml one; this task
    # exists so a developer can run all `.cfg` files locally.
    command: 'bash scripts/run-tlc-checks.sh'
    inputs:
      - 'scripts/run-tlc-checks.sh'
      - 'verification/tla/*.tla'
      - 'verification/tla/*.cfg'
      - '.moon/tasks/all.yml'
    options:
      # Off-CI: the canonical tlc pipeline is verify-tlc in
      # .moon/tasks/tlc.yml.
      runInCI: false

  verify-lean:
    # Lean proof verifier wrapper. The active proofs are in
    # ${LEAN_PROOF_DIR:-proofs/lean}; the script is fail-closed
    # when the dir is missing and LEAN_REQUIRED != 1.
    command: 'bash scripts/verify-lean.sh'
    inputs:
      - 'scripts/verify-lean.sh'
      - 'proofs/lean/**/*'
      - '.moon/tasks/all.yml'
    options:
