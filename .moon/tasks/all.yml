fileGroups:
  sources:
    - 'Cargo.toml'
    - 'Cargo.lock'
    - 'rust-toolchain.toml'
    - 'src/**/*'
    - 'crates/**/*'
    - 'contracts/**/*'
    - 'benches/**/*'
    - 'examples/**/*'
    - 'build.rs'
  tests:
    - 'tests/**/*'
    - 'fuzz/**/*'
  configs:
    - '.cargo/**/*'
    - '.moon/**/*'
    - '.config/**/*'
    - 'deny.toml'
    - 'cargo-vet.toml'
    - 'justfile'
    - 'scripts/**/*'
  docs:
    - 'README.md'
    - 'docs/**/*'
  proofs:
    - 'proofs/**/*'
    - 'VERIFYING_RUST_WITH_LEAN_AND_GATES.md'
    - 'moon-rust-verification.yml'

tasks:
  fmt:
    command: 'rustup run nightly-2026-04-28 cargo fmt --all --check'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      runInCI: true

  lint-src:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      mkdir -p target/tmp
      flock --shared target/moon-locks/source-mutation.lock env TMPDIR="$PWD/target/tmp" RUSTC_WRAPPER= RUSTFLAGS="-Dwarnings" rustup run nightly-2026-04-28 cargo clippy --quiet --workspace --lib --bins --examples --all-features -- -D warnings -W clippy::all -D unsafe_code -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic -D clippy::panic_in_result_fn -D clippy::todo -D clippy::unimplemented -D clippy::dbg_macro -D clippy::indexing_slicing -D clippy::string_slice -D clippy::get_unwrap -D clippy::arithmetic_side_effects -D clippy::as_conversions -D clippy::let_underscore_must_use -D clippy::await_holding_lock -D clippy::print_stdout -D clippy::print_stderr
    deps:
      - 'panic-surface'
      - 'ignored-fallible-results'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    options:
      runInCI: true

  panic-surface:
    command: 'bash scripts/check-panic-surface.sh'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - 'scripts/check-panic-surface.sh'
      - '.moon/tasks/all.yml'
    options:
      runInCI: true

  ignored-fallible-results:
    command: 'bash scripts/check-ignored-fallible-results.sh'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - 'scripts/check-ignored-fallible-results.sh'
      - 'scripts/ignored-fallible-results.allow'
      - '.moon/tasks/all.yml'
    options:
      runInCI: true

  check:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      mkdir -p target/tmp
      flock --shared target/moon-locks/source-mutation.lock env TMPDIR="$PWD/target/tmp" RUSTC_WRAPPER= RUSTFLAGS="-Dwarnings" timeout 10m rustup run nightly-2026-04-28 cargo check --quiet --workspace --all-targets --all-features
    deps:
      - 'nightly-feature-gate'
      - 'agent-cli-contract'
      - 'beads-server-mode'
      - 'hot-cold-forbidden-apis'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      runInCI: true

  nightly-feature-gate:
    command: 'bash scripts/check-nightly-features.sh'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      runInCI: true

  agent-cli-contract:
    command: 'bash scripts/check-agent-cli-contract.sh'
    toolchains:
      - rust
    inputs:
      - 'crates/vb_cli/src/**/*'
      - 'velvet-ballistics-MASTER.md'
      - 'scripts/check-agent-cli-contract.sh'
      - '.moon/tasks/all.yml'
    options:
      runInCI: true

  beads-server-mode:
    command: 'bash scripts/check-beads-server-mode.sh'
    inputs:
      - 'scripts/check-beads-server-mode.sh'
      - '.beads/metadata.json'
      - '.beads/config.yaml'
      - '.gitignore'
      - 'AGENTS.md'
      - '.moon/tasks/all.yml'
    options:
      runInCI: true

  blocker-closure-evidence:
    command: 'python scripts/check-blocker-closure-evidence.py --parent vb-jpq7'
    inputs:
      - 'scripts/check-blocker-closure-evidence.py'
      - 'schemas/blocker-closure-evidence.schema.json'
      - 'docs/blocker-closure-evidence.md'
      - 'evidence/blocker-closure-evidence.jsonl'
      - '.moon/tasks/all.yml'
    options:
      cache: false
      runInCI: false

  workspace-assertions:
    command: 'bash scripts/check-workspace-assertions.sh'
    inputs:
      - 'Cargo.toml'
      - 'scripts/check-workspace-assertions.rs'
      - 'scripts/check-workspace-assertions.sh'
      - '.moon/tasks/all.yml'
      - 'crates/*/Cargo.toml'
      - 'crates/*/src/generated/**/*'
    options:
      runInCI: true

  test-integrity:
    command: 'bash scripts/check-test-integrity.sh'
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
      - 'scripts/check-test-integrity.rs'
      - 'scripts/check-test-integrity.sh'
      - '.moon/tasks/all.yml'
    options:
      runInCI: true

  test-determinism:
    command: 'bash scripts/check-test-determinism.sh'
    inputs:
      - 'scripts/check-test-determinism.py'
      - 'scripts/check-test-determinism.sh'
      - '.moon/tasks/all.yml'
      - 'README.md'
      - 'crates/*/tests/**/*.rs'
      - 'crates/workspace_tests/src/**/*.rs'
    options:
      cache: false
      # Current tree has pre-existing findings; run explicitly until clean.
      runInCI: false

  banned-token-gates:
    deps:
      - 'panic-surface'
      - 'workspace-assertions'
      - 'ignored-fallible-results'
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    options:
      runInCI: true

  hot-cold-forbidden-apis:
    command: 'bash scripts/check-hot-cold-forbidden-apis.sh'
    inputs:
      - 'scripts/check-hot-cold-forbidden-apis.rs'
      - 'scripts/check-hot-cold-forbidden-apis.sh'
      - 'scripts/hot-cold-forbidden-apis.allow'
      - 'crates/vb_core/src/**/*'
      - 'crates/vb_runtime/src/**/*'
      - 'crates/vb_storage/src/**/*'
      - 'crates/vb_ipc/src/**/*'
      - '.moon/tasks/all.yml'
    options:
      runInCI: true

  nightly-feature-cargo-probe:
    script: |
      set -euo pipefail
      # check already runs the exact all-targets/all-features cargo probe.
      true
    deps:
      - 'check'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      runInCI: true

  source-length:
    command: 'bash scripts/check-source-length.sh'
    deps:
      - 'workspace-assertions'
      - 'banned-token-gates'
      - 'test-integrity'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      runInCI: true

  hardened-build:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      mkdir -p target/tmp
      flock --shared target/moon-locks/source-mutation.lock env TMPDIR="$PWD/target/tmp" RUSTC_WRAPPER= RUSTFLAGS="-Dwarnings" CARGO_TARGET_DIR=target/hardened-build rustup run nightly-2026-04-28 cargo build --quiet -p vb_cli --bin velvet-ballastics --all-features --profile hardened
    deps:
      - 'test'
      - 'lint-src'
      - 'source-length'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    outputs:
      - 'target/hardened-build/hardened/**'
    options:
      cache: false
      runInCI: true

  test:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      mkdir -p target/tmp
      flock --shared target/moon-locks/source-mutation.lock env TMPDIR="$PWD/target/tmp" RUSTC_WRAPPER= RUSTFLAGS="-Dwarnings" timeout 10m rustup run nightly-2026-04-28 cargo nextest run --cargo-quiet --workspace --all-features
    deps:
      - 'check'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      runInCI: true

  doc-test:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      mkdir -p target/tmp
      flock --shared target/moon-locks/source-mutation.lock env TMPDIR="$PWD/target/tmp" RUSTC_WRAPPER= RUSTFLAGS="-Dwarnings" rustup run nightly-2026-04-28 cargo test --quiet --doc --workspace --all-features
    deps:
      - 'test'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    options:
      runInCI: true

  doc:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      mkdir -p target/tmp
      flock --shared target/moon-locks/source-mutation.lock env TMPDIR="$PWD/target/tmp" RUSTC_WRAPPER= RUSTFLAGS="-Dwarnings" RUSTDOCFLAGS="-Dwarnings" rustup run nightly-2026-04-28 cargo doc --quiet --workspace --all-features --no-deps
    deps:
      - 'test'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
      - '@globs(docs)'
    outputs:
      - 'target/doc/**'
    options:
      cache: false
      runInCI: true

  supply-chain:
    script: |
      set -euo pipefail
      mkdir -p target/supply-chain/geiger
      run_logged() {
        log_file="$1"
        shift
        if ! "$@" >"$log_file" 2>&1; then
          cat "$log_file"
          return 1
        fi
      }

      run_logged target/supply-chain/audit.log timeout 2m rustup run nightly-2026-04-28 cargo audit --quiet
      run_logged target/supply-chain/deny.log timeout 5m rustup run nightly-2026-04-28 cargo deny check --hide-inclusion-graph
      run_logged target/supply-chain/vet.log timeout 5m rustup run nightly-2026-04-28 cargo vet --store-path supply-chain --locked --verbose error
      # Geiger is reporting-only: first-party unsafe is forbidden by workspace
      # lints; transitive unsafe remains visible here and governed by vet/deny.
      for package in vb_boundary_inventory vb_compile vb_core vb_doc vb_expr vb_ipc vb_runtime vb_storage vb_validate vb_yaml velvet-ballastics-workspace-tests; do
        package_target_dir="target/supply-chain/geiger/$package"
        mkdir -p "$package_target_dir"
        CARGO_TARGET_DIR="$package_target_dir" timeout --kill-after=10s 90s rustup run nightly-2026-04-28 cargo geiger -p "$package" --all-features --all-dependencies --include-tests --output-format GitHubMarkdown >"target/supply-chain/geiger/$package.md" 2>"target/supply-chain/geiger/$package.err" || true
      done
      run_logged target/supply-chain/machete.log timeout 2m rustup run nightly-2026-04-28 cargo machete --skip-target-dir crates/vb_compile crates/vb_core crates/vb_doc crates/vb_expr crates/vb_ipc crates/vb_runtime crates/vb_storage crates/vb_validate crates/vb_yaml crates/workspace_tests
      # SKIPPED: vb_boundary_inventory is not published to crates.io so semver-checks cannot run
      # run_logged target/supply-chain/semver.log timeout 5m rustup run nightly-2026-04-28 cargo semver-checks check-release
      # SKIPPED: requires published crate for diff baseline
      # run_logged target/supply-chain/public-api.log timeout 5m rustup run nightly-2026-04-28 cargo public-api diff
      # SKIPPED: bloat is informational only and fails on workspace with deferred crates
      # run_logged target/supply-chain/bloat.log timeout 5m rustup run nightly-2026-04-28 cargo bloat --release --crates
    toolchains:
      - rust
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'cargo-vet.toml'
      - 'supply-chain/**/*'
      - '@globs(configs)'
    outputs:
      - 'target/supply-chain/**'
    options:
      runInCI: true

  feature-powerset:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      mkdir -p target/tmp
      flock --shared target/moon-locks/source-mutation.lock env TMPDIR="$PWD/target/tmp" RUSTC_WRAPPER= RUSTFLAGS="-Dwarnings" timeout 10m rustup run nightly-2026-04-28 cargo hack check --workspace --feature-powerset --depth 1 --exclude velvet-ballastics-fuzz --quiet
    deps:
      - 'check'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    options:
      runInCI: true

  miri:
    script: |
      set -euo pipefail
      mkdir -p target/miri-tmp
      mkdir -p target/moon-locks
      TMPDIR="$PWD/target/miri-tmp" flock --shared target/moon-locks/source-mutation.lock env -u RUSTC_WRAPPER RUSTFLAGS="-Dwarnings" MIRIFLAGS="-Zmiri-disable-isolation" timeout 3m rustup run nightly-2026-04-28 cargo miri test --quiet -p vb_core --lib --all-features ids::tests::run_id_zero_constant
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      runInCI: true

  coverage:
    script: |
      set -euo pipefail
      mkdir -p target/llvm-cov
      mkdir -p target/moon-locks
      mkdir -p target/tmp
      # Smoke policy: full confidence comes from the test lane; CI coverage proves
      # llvm-cov wiring and report generation without re-running every test.
      flock --shared target/moon-locks/source-mutation.lock env TMPDIR="$PWD/target/tmp" RUSTC_WRAPPER= RUSTFLAGS="-Dwarnings" timeout 3m rustup run nightly-2026-04-28 cargo llvm-cov test --quiet -p vb_core --lib --all-features --lcov --output-path target/llvm-cov/lcov.info -- action::tests::validate_action_outcome_failed_always_succeeds
    deps:
      - 'check'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    outputs:
      - 'target/llvm-cov/**'
    options:
      runInCI: true

  mutants-smoke:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      mkdir -p target/tmp
      # Smoke policy: prove cargo-mutants integration on a bounded, deterministic
      # vb_core slice without mutating the source tree in place. Full mutation-score
      # debt is tracked separately.
      flock --shared target/moon-locks/source-mutation.lock env TMPDIR="$PWD/target/tmp" RUSTC_WRAPPER= timeout 10m rustup run nightly-2026-04-28 cargo mutants \
        --package vb_core \
        --file crates/vb_core/src/diagnostic.rs \
        --re 'is_supported_code -> bool with false' \
        --baseline skip \
        --jobs 1 \
        --gitignore true \
        --no-shuffle \
        --no-times \
        --timeout 60 \
        --minimum-test-timeout 2 \
        --output target/mutants-smoke \
        -- --lib diagnostic::
    deps:
      - 'check'
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/vb_core/Cargo.toml'
      - 'crates/vb_core/src/diagnostic.rs'
      - '.moon/tasks/all.yml'
    options:
      cache: false
      runInCI: true

  fuzz-smoke:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      mkdir -p target/fuzz-smoke
      if ! flock --shared target/moon-locks/source-mutation.lock env RUSTFLAGS="-Dwarnings" rustup run nightly-2026-04-28 cargo fuzz build --target x86_64-unknown-linux-gnu >target/fuzz-smoke/build.log 2>target/fuzz-smoke/build.err; then
        cat target/fuzz-smoke/build.log
        cat target/fuzz-smoke/build.err
        exit 1
      fi
      for fuzz_target in yaml_events ipc_frame journal_event compiled_ir; do
        flock --shared target/moon-locks/source-mutation.lock env RUSTFLAGS="-Dwarnings" timeout 30s rustup run nightly-2026-04-28 cargo fuzz run "${fuzz_target}" --target x86_64-unknown-linux-gnu -- -max_total_time=1 >"target/fuzz-smoke/${fuzz_target}.log" 2>"target/fuzz-smoke/${fuzz_target}.err"
      done
    toolchains:
      - rust
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'fuzz/**/*'
      - 'crates/vb_core/**/*'
      - 'crates/vb_yaml/**/*'
      - 'crates/vb_expr/**/*'
      - 'crates/vb_compile/**/*'
      - 'crates/vb_ipc/**/*'
      - 'crates/vb_storage/**/*'
    options:
      runInCI: true
    outputs:
      - 'target/fuzz-smoke/**'

  sanitizer-address-check:
    script: 'RUSTFLAGS="-Zsanitizer=address" rustup run nightly-2026-04-28 cargo test -Zbuild-std --target x86_64-unknown-linux-gnu --workspace --all-features --no-run'
    deps:
      - 'check'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      runInCI: true

  bench-build:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      mkdir -p target/tmp
      export CARGO_TARGET_DIR=target/bench-build
      flock --shared target/moon-locks/source-mutation.lock env TMPDIR="$PWD/target/tmp" RUSTC_WRAPPER= RUSTFLAGS="-Dwarnings" rustup run nightly-2026-04-28 cargo bench --quiet -p velvet-ballastics-workspace-tests --bench velvet_ballastics --bench vb_qi37_1_1_recovery --all-features --no-run
    deps:
      - 'check'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    outputs:
      - 'target/bench-build/release/deps/**'
    options:
      runInCI: true

  benchmark-proof:
    command: 'rustup run nightly-2026-04-28 cargo bench --workspace --all-features -- --save-baseline vb-current'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    outputs:
      - 'target/criterion/**'
    options:
      runInCI: false

  pgo-instrument-build:
    script: 'RUSTFLAGS="-Cprofile-generate=$PWD/target/pgo/profiles" rustup run nightly-2026-04-28 cargo build -p vb_cli --bin velvet-ballistics --all-features --profile maxperf'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    outputs:
      - 'target/maxperf/**'
      - 'target/pgo/profiles/**'
    options:
      runInCI: false

  pgo-optimized-build:
    script: 'RUSTFLAGS="-Cprofile-use=$PWD/target/pgo/merged.profdata -Cllvm-args=-pgo-warn-missing-function" rustup run nightly-2026-04-28 cargo build -p vb_cli --bin velvet-ballistics --all-features --profile maxperf'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
      - 'target/pgo/merged.profdata'
    outputs:
      - 'target/maxperf/**'
    options:
      runInCI: false

  maxperf:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      mkdir -p target/tmp
      export CARGO_TARGET_DIR=target/maxperf
      flock --shared target/moon-locks/source-mutation.lock env TMPDIR="$PWD/target/tmp" RUSTC_WRAPPER= RUSTFLAGS="-Dwarnings" rustup run nightly-2026-04-28 cargo build --quiet -p vb_cli --bin velvet-ballastics --all-features --release
    deps:
      - 'test'
      - 'lint-src'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    outputs:
      - 'target/maxperf/release/**'
    options:
      runInCI: false

  maxperf-native:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      mkdir -p target/tmp
      export CARGO_TARGET_DIR=target/maxperf-native
      export RUSTFLAGS="-C target-cpu=native -Dwarnings"
      flock --shared target/moon-locks/source-mutation.lock env TMPDIR="$PWD/target/tmp" RUSTC_WRAPPER= rustup run nightly-2026-04-28 cargo build --quiet -p vb_cli --bin velvet-ballastics --all-features --release
    deps:
      - 'test'
      - 'lint-src'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    outputs:
      - 'target/maxperf-native/release/**'
    options:
      runInCI: false

  verify-fast:
    command: 'bash scripts/rust-verification-gauntlet.sh fast'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
      - '@globs(proofs)'
    options:
      cache: false
      runInCI: false

  verify-standard:
    command: 'bash scripts/rust-verification-gauntlet.sh standard'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
      - '@globs(proofs)'
    options:
      cache: false
      runInCI: false

  verify-deep:
    command: 'bash scripts/rust-verification-gauntlet.sh deep'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
      - '@globs(proofs)'
    options:
      cache: false
      runInCI: false

  check-stepstate-matrix:
    command: 'bash scripts/check-stepstate-matrix.sh'
    toolchains:
      - rust
    inputs:
      - 'crates/vb_proof_kernels/src/step_state.rs'
    outputs:
      - 'scripts/check-stepstate-matrix.sh'
    options:
      cache: false
      runInCI: true

  verify-proof:
    command: 'bash scripts/rust-verification-gauntlet.sh proof'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
      - '@globs(proofs)'
    options:
      cache: false
      runInCI: false

  verify-all:
    command: 'env VERIFY_BEAD_ID=vb-nf2u ALLOW_BEAD_LOCKBUD_WAIVER=1 bash scripts/rust-verification-gauntlet.sh all'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
      - '@globs(proofs)'
    options:
      cache: false
      runInCI: false

  contracts:
    command: 'cargo xtask contracts --check'
    toolchains:
      - rust
    inputs:
      - 'contracts/**/*'
      - '.cargo/config.toml'
      - '.moon/tasks/all.yml'
    options:
      runInCI: true

  quick:
    script: |
      moon run :fmt
      moon run :lint-src
      moon run :check
      moon run :nightly-feature-gate
    options:
      runInCI: false
