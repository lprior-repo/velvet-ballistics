fileGroups:
  sources:
    - 'Cargo.toml'
    - 'Cargo.lock'
    - 'rust-toolchain.toml'
    - 'src/**/*'
    - 'crates/**/*'
    - 'contracts/**/*'
    - 'benches/**/*'
    - 'examples/**/*'
    - 'build.rs'
  tests:
    - 'tests/**/*'
    - 'fuzz/Cargo.toml'
    - 'fuzz/Cargo.lock'
    - 'fuzz/fuzz_targets.rs'
    - 'fuzz/fuzz_targets/**/*'
    - 'fuzz/src/**/*'
  configs:
    - '.cargo/**/*'
    - '.moon/**/*'
    - '.config/**/*'
    - 'deny.toml'
    - 'cargo-vet.toml'
    - 'scripts/**/*'
  docs:
    - 'README.md'
    - 'docs/**/*'
  proofs:
    - 'proofs/**/*'
    - 'VERIFYING_RUST_WITH_LEAN_AND_GATES.md'
    - 'moon-rust-verification.yml'

tasks:
  fmt:
    command: 'rustup run nightly-2026-04-28 cargo fmt --all --check'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      runInCI: true

  lint-src:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      mkdir -p target/tmp
      flock --shared target/moon-locks/source-mutation.lock env TMPDIR="$PWD/target/tmp" RUSTC_WRAPPER= RUSTFLAGS="-Dwarnings" rustup run nightly-2026-04-28 cargo clippy --quiet --workspace --lib --bins --examples --all-features -- -D warnings -W clippy::all -D unsafe_code -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic -D clippy::panic_in_result_fn -D clippy::todo -D clippy::unimplemented -D clippy::dbg_macro -D clippy::indexing_slicing -D clippy::string_slice -D clippy::get_unwrap -D clippy::arithmetic_side_effects -D clippy::as_conversions -D clippy::let_underscore_must_use -D clippy::await_holding_lock -D clippy::print_stdout -D clippy::print_stderr
    deps:
      - 'panic-surface'
      - 'ignored-fallible-results'
      - 'unsafe-audit'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    options:
      runInCI: true

  panic-surface:
    command: 'bash scripts/check-panic-surface.sh'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - 'scripts/check-panic-surface.sh'
      - '.moon/tasks/all.yml'
    options:
      runInCI: true

  ignored-fallible-results:
    command: 'bash scripts/check-ignored-fallible-results.sh'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - 'scripts/check-ignored-fallible-results.sh'
      - 'scripts/ignored-fallible-results.allow'
      - '.moon/tasks/all.yml'
    options:
      runInCI: true

  unsafe-audit:
    script: |
      set -euo pipefail
      if ! command -v rg >/dev/null 2>&1; then
        printf 'Missing required scanner: rg\n' >&2
        exit 127
      fi
      mkdir -p target/static-audit
      unsafe_pattern='(^|[^A-Za-z0-9_])unsafe[[:space:]]*(\{|fn\b|trait\b|impl\b|extern\b|\()'
      log_file='target/static-audit/unsafe-audit.log'
      if rg -n "$unsafe_pattern" crates --glob '*.rs' --glob '!**/tests/**' --glob '!**/benches/**' --glob '!**/examples/**' --glob '!**/fixtures/**' --glob '!**/verification/**' --glob '!**/kani*/**' >"$log_file"; then
        cat "$log_file" >&2
        printf 'Forbidden first-party unsafe construct found.\n' >&2
        exit 1
      else
        rg_status="$?"
        if [ "$rg_status" -eq 1 ]; then
          :
        else
          cat "$log_file" >&2
          printf 'Unsafe audit scan failed with rg status %s.\n' "$rg_status" >&2
          exit "$rg_status"
        fi
      fi
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '.moon/tasks/all.yml'
    outputs:
      - 'target/static-audit/unsafe-audit.log'
    options:
      runInCI: true

  check:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      mkdir -p target/tmp
      flock --shared target/moon-locks/source-mutation.lock env TMPDIR="$PWD/target/tmp" RUSTC_WRAPPER= RUSTFLAGS="-Dwarnings" timeout 10m rustup run nightly-2026-04-28 cargo check --quiet --workspace --all-targets --all-features
    deps:
      - 'nightly-feature-gate'
      - 'agent-cli-contract'
      - 'beads-server-mode'
      - 'hot-cold-forbidden-apis'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      runInCI: true

  nightly-feature-gate:
    command: 'bash scripts/check-nightly-features.sh'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      runInCI: true

  # First-party feature-scope probe. Drives `cargo` (rather than a static
  # source scan) to enumerate the actually-compiled feature set under the
  # pinned nightly toolchain. Use this in addition to `nightly-feature-gate`
  # (which scans source for forbidden tokens). See bead vb-qblm4.
  nightly-feature-cargo-probe:
    script: |
      bash -c '
        set -euo pipefail
        rustup run nightly-2026-04-28 cargo tree -p velvet-ballistics -e features \
          --all-features --format "{p} {f}" > /tmp/opencode/nightly-features.txt
        rustup run nightly-2026-04-28 cargo metadata --format-version 1 \
          --all-features > /tmp/opencode/nightly-features-metadata.json
        echo "[nightly-feature-cargo-probe] OK: cargo-driven feature enumeration complete."
      '
    toolchains:
      - rust
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**/Cargo.toml'
    options:
      runInCI: true

  agent-cli-contract:
    command: 'bash scripts/check-agent-cli-contract.sh'
    toolchains:
      - rust
    inputs:
      - 'crates/velvet_ballistics/src/**/*'
      - 'velvet-ballistics-MASTER.md'
      - 'scripts/check-agent-cli-contract.sh'
      - '.moon/tasks/all.yml'
    options:
      runInCI: true

  beads-server-mode:
    command: 'bash scripts/check-beads-server-mode.sh'
    inputs:
      - 'scripts/check-beads-server-mode.sh'
      - '.beads/metadata.json'
      - '.beads/config.yaml'
      - '.gitignore'
      - 'AGENTS.md'
      - '.moon/tasks/all.yml'
    options:
      runInCI: true

  blocker-closure-evidence:
    script: 'python scripts/check-vb-jpq7-closure-evidence.py --parent vb-jpq7 --bd-workdir "${VB_JPQ7_BD_WORKDIR:-/home/lewis/src/velvet-ballistics}"'
    inputs:
      - 'scripts/check-vb-jpq7-closure-evidence.py'
      - 'schemas/vb-jpq7-closure-evidence.schema.json'
      - 'docs/vb-jpq7-closure-evidence.md'
      - '.beads/vb-jpq7/closure-evidence-manifest.jsonl'
      - '.moon/tasks/all.yml'
    options:
      cache: false
      runInCI: true

  workspace-assertions:
    command: 'bash scripts/check-workspace-assertions.sh'
    inputs:
      - 'Cargo.toml'
      - 'scripts/check-workspace-assertions.rs'
      - 'scripts/check-workspace-assertions.sh'
      - '.moon/tasks/all.yml'
      - 'crates/*/Cargo.toml'
      - 'crates/*/src/generated/**/*'
    options:
      runInCI: true

  test-integrity:
    command: 'bash scripts/check-test-integrity.sh'
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
      - 'scripts/check-test-integrity.rs'
      - 'scripts/check-test-integrity.sh'
      - '.moon/tasks/all.yml'
    options:
      runInCI: true

  test-determinism:
    command: 'bash scripts/check-test-determinism.sh'
    inputs:
      - 'scripts/check-test-determinism.py'
      - 'scripts/check-test-determinism.sh'
      - '.moon/tasks/all.yml'
      - 'README.md'
      - 'crates/*/tests/**/*.rs'
      - 'crates/workspace_tests/src/**/*.rs'
    options:
      cache: false
      # Current tree has pre-existing findings; run explicitly until clean.
      runInCI: false

  banned-token-gates:
    deps:
      - 'panic-surface'
      - 'workspace-assertions'
      - 'ignored-fallible-results'
      - 'unsafe-audit'
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    options:
      runInCI: true

  hot-cold-forbidden-apis:
    command: 'bash scripts/check-hot-cold-forbidden-apis.sh'
    inputs:
      - 'scripts/check-hot-cold-forbidden-apis.rs'
      - 'scripts/check-hot-cold-forbidden-apis.sh'
      - 'scripts/hot-cold-forbidden-apis.allow'
      - 'crates/vb_core/src/**/*'
      - 'crates/vb_runtime/src/**/*'
      - 'crates/vb_storage/src/**/*'
      - 'crates/vb_ipc/src/**/*'
      - '.moon/tasks/all.yml'
    options:
      runInCI: true

  source-length:

    command: 'bash scripts/check-source-length.sh'
    deps:
      - 'workspace-assertions'
      - 'banned-token-gates'
      - 'test-integrity'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      runInCI: true

  hardened-build:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      mkdir -p target/tmp
      # Default CARGO_TARGET_DIR; --profile hardened is handled by Cargo's
      # profile fingerprint, so we keep dependency-graph cache hot with
      # `test`/`check`/`lint-src` even though the binary profile differs.
      flock --shared target/moon-locks/source-mutation.lock env TMPDIR="$PWD/target/tmp" RUSTC_WRAPPER= RUSTFLAGS="-Dwarnings" rustup run nightly-2026-04-28 cargo build --quiet -p velvet-ballistics --bin velvet-ballistics --all-features --profile hardened
    deps:
      - 'test'
      - 'lint-src'
      - 'source-length'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    outputs:
      - 'target/hardened/**'
    options:
      cache: false
      runInCI: true

  test:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      mkdir -p target/tmp
      flock --shared target/moon-locks/source-mutation.lock env TMPDIR="$PWD/target/tmp" RUSTC_WRAPPER= RUSTFLAGS="-Dwarnings" timeout 10m rustup run nightly-2026-04-28 cargo nextest run --cargo-quiet --workspace --all-features
    deps:
      - 'check'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      runInCI: true

  doc-test:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      mkdir -p target/tmp
      flock --shared target/moon-locks/source-mutation.lock env TMPDIR="$PWD/target/tmp" RUSTC_WRAPPER= RUSTFLAGS="-Dwarnings" rustup run nightly-2026-04-28 cargo test --quiet --doc --workspace --all-features
    deps:
      - 'test'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    options:
      runInCI: true

  doc:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      mkdir -p target/tmp
      flock --shared target/moon-locks/source-mutation.lock env TMPDIR="$PWD/target/tmp" RUSTC_WRAPPER= RUSTFLAGS="-Dwarnings" RUSTDOCFLAGS="-Dwarnings" rustup run nightly-2026-04-28 cargo doc --quiet --workspace --all-features --no-deps
    deps:
      - 'test'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
      - '@globs(docs)'
    outputs:
      - 'target/doc/**'
    options:
      cache: false
      runInCI: true

  supply-chain:
    script: |
      set -euo pipefail
      mkdir -p target/supply-chain/geiger

      # Advisory report runner: captures stdout/stderr and exact exit status
      # but always returns 0 so the task continues. Exit status is written to
      # a status file, never relabeled as PASS. Timeouts (124) and missing
      # tools (127) are captured naturally as their exit codes.
      run_advisory_report() {
        tool_name="$1"
        shift
        local out_file="target/supply-chain/${tool_name}.out"
        local err_file="target/supply-chain/${tool_name}.err"
        local status_file="target/supply-chain/${tool_name}.status"

        printf 'Running advisory report: %s\n' "$tool_name" >&2
        if "$@" >"$out_file" 2>"$err_file"; then
          rc=0
        else
          rc=$?
        fi
        printf '%d\n' "$rc" >"$status_file"
        printf 'Advisory report %s completed with status %d\n' "$tool_name" "$rc" >&2
        return 0
      }

      # Audit: actual vulnerabilities are fail-closed. The 2026-05-23 owner
      # waiver makes deny/vet/geiger/machete advisory, but cargo audit
      # (actual security CVEs) remains blocking.
      printf 'Running cargo audit (fail-closed)...\n' >&2
      if timeout 2m rustup run nightly-2026-04-28 cargo audit --quiet \
           >target/supply-chain/audit.out 2>target/supply-chain/audit.err; then
        printf '0\n' >target/supply-chain/audit.status
        printf 'cargo audit passed\n' >&2
      else
        rc=$?
        printf '%d\n' "$rc" >target/supply-chain/audit.status
        printf 'cargo audit found vulnerabilities (exit %d)\n' "$rc" >&2
        cat target/supply-chain/audit.out >&2
        cat target/supply-chain/audit.err >&2
        exit "$rc"
      fi

      # Advisory reports per 2026-05-23 owner waiver (MASTER 114, 1683, 1721, 4786).
      # Nonzero report status remains nonzero in status file but task continues.
      run_advisory_report deny timeout 5m rustup run nightly-2026-04-28 cargo deny check --hide-inclusion-graph
      run_advisory_report vet timeout 5m rustup run nightly-2026-04-28 cargo vet --store-path supply-chain --locked --verbose error

      # Geiger per-package: runs from each package directory, writes per-package
      # markdown report. Nonzero status recorded but task continues (advisory).
      for package in vb_compile vb_core vb_expr vb_yaml vb_ipc vb_runtime vb_storage vb_validate velvet-ballistics velvet-ballistics-workspace-tests velvet-ballistics-fuzz; do
        package_target_dir="target/supply-chain/geiger/${package}"
        mkdir -p "$package_target_dir"
        package_dir="crates/${package//velvet-ballistics-workspace-tests/workspace_tests}"
        if [[ "$package" == "velvet-ballistics" ]]; then
          package_dir="crates/velvet_ballistics"
        elif [[ "$package" == "velvet-ballistics-workspace-tests" ]]; then
          package_dir="crates/workspace_tests"
        elif [[ "$package" == "velvet-ballistics-fuzz" ]]; then
          package_dir="fuzz"
        fi
        printf 'Running geiger on %s...\n' "$package" >&2
        if CARGO_TARGET_DIR="$package_target_dir" timeout --kill-after=10s 90s bash -c "cd '${package_dir}' && rustup run nightly-2026-04-28 cargo geiger --all-features --all-dependencies --include-tests --output-format GitHubMarkdown" >"${package_target_dir}/geiger.md" 2>"${package_target_dir}/geiger.err"; then
          geiger_rc=0
        else
          geiger_rc=$?
        fi
        printf '%d\n' "$geiger_rc" >"${package_target_dir}/geiger.status"
        printf 'Geiger on %s completed with status %d\n' "$package" "$geiger_rc" >&2
      done

      run_advisory_report machete timeout 2m rustup run nightly-2026-04-28 cargo machete --skip-target-dir crates/velvet_ballistics crates/vb_compile crates/vb_core crates/vb_expr crates/vb_yaml crates/vb_ipc crates/vb_runtime crates/vb_storage crates/vb_validate crates/workspace_tests fuzz

      # SKIPPED: first-party crates are not published to crates.io so semver-checks cannot run
      # SKIPPED: requires published crate for diff baseline
      # SKIPPED: bloat is informational only and fails on workspace with deferred crates

      printf 'Supply chain reporting complete. See target/supply-chain/ for reports.\n' >&2
    toolchains:
      - rust
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'cargo-vet.toml'
      - 'supply-chain/**/*'
      - '@globs(configs)'
    outputs:
      - 'target/supply-chain/**'
    options:
      runInCI: true

  feature-powerset:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      mkdir -p target/tmp
      flock --shared target/moon-locks/source-mutation.lock env TMPDIR="$PWD/target/tmp" RUSTC_WRAPPER= RUSTFLAGS="-Dwarnings" timeout 10m rustup run nightly-2026-04-28 cargo hack check --workspace --feature-powerset --depth 1 --exclude velvet-ballistics-fuzz --quiet
    deps:
      - 'check'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    options:
      runInCI: true

  miri:
    script: |
      bash scripts/run-miri-smoke.sh
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    options:
      runInCI: true

  coverage:
    script: |
      set -euo pipefail
      mkdir -p target/llvm-cov
      mkdir -p target/moon-locks
      mkdir -p target/tmp
      # Smoke policy: full confidence comes from the test lane; CI coverage proves
      # llvm-cov wiring and report generation without re-running every test.
      flock --shared target/moon-locks/source-mutation.lock env TMPDIR="$PWD/target/tmp" RUSTC_WRAPPER= RUSTFLAGS="-Dwarnings" timeout 3m rustup run nightly-2026-04-28 cargo llvm-cov test --quiet -p vb_core --lib --all-features --lcov --output-path target/llvm-cov/lcov.info -- action::tests::validate_action_outcome_failed_always_succeeds
    deps:
      - 'check'
    toolchains:
      - rust
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@globs(configs)'
    outputs:
      - 'target/llvm-cov/**'
    options:
      runInCI: true

  mutants-smoke:
    script: |
      set -euo pipefail
      mkdir -p target/moon-locks
      mkdir -p target/tmp
      # Smoke policy: prove cargo-mutants integration on a bounded, deterministic
      # vb_core slice without mutating the source tree in place. Full mutation-score
      # debt is tracked separately.
      flock --shared target/moon-locks/source-mutation.lock env TMPDIR="$PWD/target/tmp" RUSTC_WRAPPER= timeout 10m rustup run nightly-2026-04-28 cargo mutants \
        --package vb_core \
        --file crates/vb_core/src/diagnostic.rs \
        --re 'is_supported_code -> bool with false' \
        --baseline skip \
        --jobs 1 \
        --gitignore true \
        --no-shuffle \
        --no-times \
        --timeout 60 \
        --minimum-test-timeout 2 \
        --output target/mutants-smoke \
        -- --lib diagnostic::
    deps:
      - 'check'
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/vb_core/Cargo.toml'
      - 'crates/vb_core/src/diagnostic.rs'
      - '.moon/tasks/all.yml'
    options:
      cache: false
      runInCI: true

  fuzz-smoke:
    script: |
      set -euo pipefail
      export PATH="/cache/cargo-shared/bin:${PATH}"
      mkdir -p target/moon-locks
      mkdir -p target/fuzz-smoke
      if ! flock --shared target/moon-locks/source-mutation.lock env RUSTFLAGS="-Dwarnings" rustup run nightly-2026-04-28 cargo fuzz build --target x86_64-unknown-linux-gnu --target-dir "$PWD/target/fuzz-asan/build" >target/fuzz-smoke/build.log 2>target/fuzz-smoke/build.err; then
        cat target/fuzz-smoke/build.log
        cat target/fuzz-smoke/build.err
        exit 1
      fi
      mapfile -t fuzz_targets < <(cargo fuzz list)
      if [ "${#fuzz_targets[@]}" -eq 0 ]; then
        echo "cargo fuzz list returned no targets" >&2
        exit 1
      fi
      bin_dir="target/fuzz-asan/build/x86_64-unknown-linux-gnu/release"
      for fuzz_target in "${fuzz_targets[@]}"; do
        bin="${bin_dir}/${fuzz_target}"
        {
          echo "=== compile evidence: ${fuzz_target} ==="
          if [ -x "${bin}" ]; then
            ls -la "${bin}"
            echo "OK: binary present"
          else
            echo "MISSING: ${bin}"
            exit 1
          fi
        } >"target/fuzz-smoke/${fuzz_target}.compile.log" 2>&1
        corpus="target/fuzz-smoke/corpus/${fuzz_target}"
        artifacts="target/fuzz-smoke/artifacts/${fuzz_target}"
        rm -rf "${corpus}" "${artifacts}"
        mkdir -p "${corpus}" "${artifacts}"
        if [ -d "fuzz/corpus/${fuzz_target}" ]; then
          cp -R "fuzz/corpus/${fuzz_target}/." "${corpus}/"
        fi
        flock --shared target/moon-locks/source-mutation.lock timeout 30s "${bin}" -artifact_prefix="${PWD}/${artifacts}/" -max_total_time=1 "${PWD}/${corpus}" >"target/fuzz-smoke/${fuzz_target}.log" 2>"target/fuzz-smoke/${fuzz_target}.err"
      done
    toolchains:
      - rust
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'fuzz/Cargo.toml'
      - 'fuzz/Cargo.lock'
      - 'fuzz/fuzz_targets.rs'
      - 'fuzz/fuzz_targets/**/*'
      - 'fuzz/src/**/*'
      - 'crates/vb_core/**/*'
      - 'crates/vb_compile/**/*'
      - 'crates/vb_ipc/**/*'
      - 'crates/vb_storage/**/*'
    options:
      runInCI: true
    outputs:
      - 'target/fuzz-smoke/**'

  fuzz-tsan:
    script: |
      set -euo pipefail
      export PATH="/cache/cargo-shared/bin:${PATH}"
      mkdir -p target/moon-locks target/fuzz-tsan
      if ! flock --shared target/moon-locks/source-mutation.lock \
        rustup run nightly-2026-04-28 cargo fuzz build --target x86_64-unknown-linux-gnu \
          --sanitizer thread \
          --target-dir "$PWD/target/fuzz-tsan/build" \
          --build-std \
        >target/fuzz-tsan/build.log 2>target/fuzz-tsan/build.err; then
        cat target/fuzz-tsan/build.log
        cat target/fuzz-tsan/build.err
        exit 1
      fi
      mapfile -t fuzz_targets < <(cargo fuzz list)
      if [ "${#fuzz_targets[@]}" -eq 0 ]; then
        echo "cargo fuzz list returned no targets" >&2
        exit 1
      fi
      for tgt in "${fuzz_targets[@]}"; do
        bin="target/fuzz-tsan/build/x86_64-unknown-linux-gnu/release/${tgt}"
        if [ -x "$bin" ]; then
          echo "TSAN-OK: $tgt"
        else
          echo "TSAN-MISSING: $tgt"
          exit 1
        fi
      done
    options:
      cache: false
      runInCI: true
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'fuzz/Cargo.toml'
      - 'fuzz/Cargo.lock'
      - 'fuzz/src/**/*'
      - 'fuzz/fuzz_targets/**/*'
      - 'crates/**/*'
      - '.moon/tasks/all.yml'

  fuzz-regress:
    script: |
      set -euo pipefail
      export PATH="/cache/cargo-shared/bin:${PATH}"
      mkdir -p target/moon-locks target/fuzz-regress
      if ! flock --shared target/moon-locks/source-mutation.lock env RUSTFLAGS="-Dwarnings" rustup run nightly-2026-04-28 cargo fuzz build --target x86_64-unknown-linux-gnu --target-dir "$PWD/target/fuzz-asan/build" >target/fuzz-regress/build.log 2>target/fuzz-regress/build.err; then
        cat target/fuzz-regress/build.log
        cat target/fuzz-regress/build.err
        exit 1
      fi
      rc=0
      while IFS= read -r artifact; do
        tgt=$(basename "$(dirname "$artifact")")
        bin="target/fuzz-asan/build/x86_64-unknown-linux-gnu/release/${tgt}"
        if [ ! -x "$bin" ]; then
          echo "MISSING: $tgt (binary required for $artifact)"
          rc=1
          continue
        fi
        echo "REPLAY: $artifact via $tgt"
        if timeout 5s "$bin" "$artifact" >"target/fuzz-regress/${tgt}.log" 2>&1; then
          echo "PASS: $artifact"
        else
          echo "REGRESSION: $artifact"
          cat "target/fuzz-regress/${tgt}.log"
          rc=1
        fi
      done < <(find fuzz/artifacts -type f \( -name 'crash-*' -o -name 'oom-*' -o -name 'leak-*' -o -name 'timeout-*' \) 2>/dev/null || true)
      exit "$rc"
    options:
      cache: false
      runInCI: true
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'fuzz/artifacts/**/*'
      - 'fuzz/Cargo.toml'
      - 'fuzz/Cargo.lock'
      - 'fuzz/src/**/*'
      - 'fuzz/fuzz_targets/**/*'
      - 'crates/**/*'
      - '.moon/tasks/all.yml'

