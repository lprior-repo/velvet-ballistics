      - 'evidence/benchmark-logs/**/*'
      - 'xtask/Cargo.toml'
      - 'xtask/src/benchmark_policy.rs'
      - 'xtask/src/cli.rs'
      - 'xtask/src/main.rs'
      - '.moon/tasks/all.yml'
    options:
      cache: false
      runInCI: true

