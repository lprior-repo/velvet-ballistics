        run_kani_bounded target/kani-vb-compile -p vb_compile --features "$KANI_COMPILE_FEATURES" --harness "$harness"
      }
      # foreach_parity: tests for_each lowering structure (just fixed GOD_RULE compliance)
      run_compile_harness foreach_body_setconst_next_edge
      run_compile_harness foreach_no_backward_edge
      run_compile_harness foreach_all_nodes_reachable
