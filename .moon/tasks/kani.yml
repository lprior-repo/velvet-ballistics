# Kani bounded model checking verification tasks.
#
# Model-only tasks must say so explicitly and must not count as production-bound
# Kani verification. In particular, the shard-command-queue model-smoke lane
# below exercises only the private Kani-only stand-in in
# `crates/vb_runtime/src/kani_shard_command_queue.rs`; it shares the public
# capacity predicate but does not prove production Crossbeam behavior.

fileGroups:
  kani_core_sources:
    - 'crates/vb_core/src/**/*'
  kani_storage_sources:
    - 'crates/vb_storage/src/**/*'
  kani_runtime_shard_command_queue_model_sources:
    - 'crates/vb_runtime/src/**/*'
  kani_validate_sources:
    - 'crates/vb_validate/src/**/*'
    - 'crates/vb_core/src/ids/**/*'
    - 'crates/vb_core/src/workflow/**/*'
  kani_compile_sources:
    - 'crates/vb_compile/src/**/*'

tasks:
  verify-kani:
    script: |
      set -euo pipefail
      mkdir -p target/kani-tmp
      mkdir -p target/moon-locks
      run_core_harness() {
        local harness="$1"
        printf 'verify-kani: running %s\n' "$harness"
        TMPDIR="$PWD/target/kani-tmp" flock --shared target/moon-locks/source-mutation.lock env -u RUSTC_WRAPPER CARGO_TARGET_DIR=target/kani-vb-core RUSTFLAGS="-Dwarnings" rustup run nightly-2026-04-28 cargo kani --lib -p vb_core --all-features --harness "$harness"
      }
      run_core_harness kani_budget_add_dim_zero
      run_core_harness kani_budget_sub_dim_zero
      run_core_harness kani_aggregate_usage_zero
      run_core_harness kani_try_add_budget_zero_current
    toolchains:
      - rust
    inputs:
      - '@globs(kani_core_sources)'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.moon/tasks/kani.yml'
    options:
      runInCI: true

  verify-kani-vb-validate:
    script: |
      set -euo pipefail
      mkdir -p target/kani-tmp
      mkdir -p target/moon-locks
      run_validate_harness() {
        local harness="$1"
        printf 'verify-kani-vb-validate: running %s\n' "$harness"
        TMPDIR="$PWD/target/kani-tmp" flock --shared target/moon-locks/source-mutation.lock env -u RUSTC_WRAPPER CARGO_TARGET_DIR=target/kani-vb-validate RUSTFLAGS="-Dwarnings" timeout 15m rustup run nightly-2026-04-28 cargo kani -p vb_validate --all-features --harness "$harness"
      }
      run_validate_harness kani_gate_08_valid_zero_accessors_pass
      run_validate_harness kani_gate_08_valid_bounded_parts_pass
      run_validate_harness kani_gate_08_valid_index_without_symbols_pass
      run_validate_harness kani_gate_08_no_panic_bounded_inputs
      run_validate_harness kani_gate_08_field_symbol_oob_rejected
      run_validate_harness kani_gate_08_index_u32_max_rejected
      run_validate_harness kani_gate_08_root_oob_rejected
      run_validate_harness kani_gate_08_path_too_deep_rejected
      run_validate_harness kani_gate_08_arbitrary_parts_valid_accessors_pass
      run_validate_harness kani_gate_08_arbitrary_parts_root_oob_rejected
      run_validate_harness kani_gate_08_arbitrary_parts_symbol_oob_rejected
      run_validate_harness kani_gate_08_arbitrary_parts_index_sentinel_rejected
      run_validate_harness kani_gate_08_full_structure_no_panic
      run_validate_harness kani_gate_08_expressions_with_accessor_refs
      run_validate_harness kani_gate_08_mixed_accessor_paths
      run_validate_harness kani_gate_08_many_accessors_varied_depths
    toolchains:
      - rust
    deps:
      - 'test'
    inputs:
      - '@globs(kani_validate_sources)'
      - 'crates/vb_validate/src/kani_gate_08_structural.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.moon/tasks/kani.yml'
    options:
      runInCI: true

  kani-model-smoke-shard-command-queue-standin:
    # Model-only smoke lane. This must never satisfy mandatory production-bound
    # Kani verification accounting.
    script: |
      set -euo pipefail
      mkdir -p target/kani-tmp
      mkdir -p target/moon-locks
      run_runtime_shard_queue_harness() {
        local harness="$1"
        printf 'kani-model-smoke-shard-command-queue-standin: running %s\n' "$harness"
        TMPDIR="$PWD/target/kani-tmp" flock --shared target/moon-locks/source-mutation.lock env -u RUSTC_WRAPPER CARGO_TARGET_DIR=target/kani-vb-runtime-shard-command-queue RUSTFLAGS="-Dwarnings" timeout 15m rustup run nightly-2026-04-28 cargo kani -p vb_runtime --features kani-shard-command-queue --harness "$harness"
      }
      run_runtime_shard_queue_harness kani_shard_command_queue_bounded_invariant
      run_runtime_shard_queue_harness kani_shard_command_queue_push
      run_runtime_shard_queue_harness kani_shard_command_queue_drain
    toolchains:
      - rust
    inputs:
      - '@globs(kani_core_sources)'
      - '@globs(kani_storage_sources)'
      - '@globs(kani_runtime_shard_command_queue_model_sources)'
      - 'crates/vb_core/Cargo.toml'
      - 'crates/vb_storage/Cargo.toml'
      - 'crates/vb_runtime/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.moon/tasks/kani.yml'
    options:
      runInCI: true

  verify-kani-vb-compile:
    script: |
      set -euo pipefail
      mkdir -p target/kani-tmp
      mkdir -p target/moon-locks
      run_compile_harness() {
        local harness="$1"
        printf 'verify-kani-vb-compile: running %s\n' "$harness"
        TMPDIR="$PWD/target/kani-tmp" flock --shared target/moon-locks/source-mutation.lock env -u RUSTC_WRAPPER CARGO_TARGET_DIR=target/kani-vb-compile RUSTFLAGS="-Dwarnings" rustup run nightly-2026-04-28 cargo kani -p vb_compile --all-features --harness "$harness"
      }
      # foreach_parity: tests for_each lowering structure (just fixed GOD_RULE compliance)
      run_compile_harness foreach_body_setconst_next_edge
      run_compile_harness foreach_no_backward_edge
      run_compile_harness foreach_all_nodes_reachable
      run_compile_harness foreach_rejects_malformed_ir
      run_compile_harness foreach_arbitrary_done_forward
      # lower_control: symbolic step/slot generation (well-written)
      run_compile_harness lower_repeat_accepts_non_max_id_and_uses_id_plus_one_slot
      run_compile_harness lower_repeat_rejects_max_id_without_overflow
      run_compile_harness lower_ask_accepts_non_max_id_and_uses_id_plus_one_resume
      run_compile_harness lower_ask_rejects_max_id_without_overflow
      run_compile_harness lower_choose_fanout_bound
      run_compile_harness lower_choose_live_api_has_fanout_check
    toolchains:
      - rust
    inputs:
      - '@globs(kani_compile_sources)'
      - 'crates/vb_core/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.moon/tasks/kani.yml'
    options:
      runInCI: true
