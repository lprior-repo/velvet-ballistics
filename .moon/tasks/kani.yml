# Kani bounded model checking verification tasks
# These tasks run formal verification using the Kani model checker

fileGroups:
  kani_core_sources:
    - 'crates/vb_core/src/**/*'
  kani_validate_sources:
    - 'crates/vb_validate/src/**/*'
    - 'crates/vb_core/src/ids/**/*'
    - 'crates/vb_core/src/workflow/**/*'

tasks:
  verify-kani:
    script: |
      set -euo pipefail
      mkdir -p target/kani-tmp
      mkdir -p target/moon-locks
      run_core_harness() {
        local harness="$1"
        printf 'verify-kani: running %s\n' "$harness"
        TMPDIR="$PWD/target/kani-tmp" flock --shared target/moon-locks/source-mutation.lock env -u RUSTC_WRAPPER CARGO_TARGET_DIR=target/kani-vb-core RUSTFLAGS="-Dwarnings" rustup run nightly-2026-04-28 cargo kani --lib -p vb_core --all-features --harness "$harness"
      }
      run_core_harness kani_budget_add_dim_zero
      run_core_harness kani_budget_sub_dim_zero
      run_core_harness kani_aggregate_usage_zero
      run_core_harness kani_try_add_budget_zero_current
    toolchains:
      - rust
    inputs:
      - '@globs(kani_core_sources)'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.moon/tasks/kani.yml'
    options:
      runInCI: true

  verify-kani-vb-validate:
    script: |
      set -euo pipefail
      mkdir -p target/kani-tmp
      mkdir -p target/moon-locks
      run_validate_harness() {
        local harness="$1"
        printf 'verify-kani-vb-validate: running %s\n' "$harness"
        TMPDIR="$PWD/target/kani-tmp" flock --shared target/moon-locks/source-mutation.lock env -u RUSTC_WRAPPER CARGO_TARGET_DIR=target/kani-vb-validate RUSTFLAGS="-Dwarnings" rustup run nightly-2026-04-28 cargo kani -p vb_validate --all-features --harness "$harness"
      }
      run_validate_harness kani_gate_08_valid_zero_accessors_pass
      run_validate_harness kani_gate_08_arbitrary_parts_valid_accessors_pass
      run_validate_harness kani_gate_08_arbitrary_parts_root_oob_rejected
      run_validate_harness kani_gate_08_arbitrary_parts_symbol_oob_rejected
    toolchains:
      - rust
    deps:
      - 'test'
    inputs:
      - '@globs(kani_validate_sources)'
      - 'crates/vb_validate/src/kani_gate_08_structural.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.moon/tasks/kani.yml'
    options:
      runInCI: true
