tasks:
  loom-list-smoke:
    command: 'bash scripts/loom-list.sh'
    toolchains:
      - rust
    inputs:
      - 'scripts/loom-list.sh'
      - 'xtask/src/loom.rs'
      - 'xtask/Cargo.toml'
      - '.cargo/config.toml'
      - '.moon/tasks/loom.yml'
    options:
      cache: false
      runInCI: true

  loom-run:
    script: |
      set -euo pipefail
      for model in journal_writer_queue action_completion_cancel timer_fired_cancel shutdown_drain bounded_queue; do
        cargo xtask loom --model "$model"
      done
    toolchains:
      - rust
    inputs:
      - 'crates/vb_core/src/**/*'
      - 'crates/vb_storage/src/**/*'
      - 'crates/vb_runtime/src/**/*'
      - 'xtask/src/loom.rs'
      - 'xtask/Cargo.toml'
      - '.cargo/config.toml'
      - 'crates/vb_runtime/src/models/loom/**/*.rs'
      - '.moon/tasks/loom.yml'
    options:
      cache: false
      runInCI: true

  loom-ps-models:
    script: |
      set -euo pipefail
      export RUSTFLAGS='--cfg loom'
      export LOOM_MAX_PREEMPTIONS='2'
      for model in 001 002 007 009 010; do
        echo "--- PS-${model} ---"
        cargo test --test "ps_${model}_model" -p vb_runtime --features loom --release
      done
    toolchains:
      - rust
    inputs:
      - 'verification/loom/vb-fzgdn/PS-0*-model.rs'
      - 'crates/vb_runtime/tests/ps_*_model.rs'
      - 'crates/vb_runtime/Cargo.toml'
      - '.moon/tasks/loom.yml'
    options:
      cache: false
      runInCI: true

  loom-idempotency-retry-eviction:
    command: 'cargo test'
    args: '-p vb_runtime --features loom --lib models::loom::idempotency_retry_eviction --release'
    env:
      RUSTFLAGS: '--cfg loom'
      LOOM_MAX_PREEMPTIONS: '2'
    toolchains:
      - rust
    inputs:
      - 'crates/vb_runtime/src/models/loom/idempotency_retry_eviction.rs'
      - 'crates/vb_runtime/src/models/loom/mod.rs'
      - 'crates/vb_runtime/src/models/sync.rs'
      - 'crates/vb_runtime/src/idempotency/**/*'
      - 'crates/vb_runtime/Cargo.toml'
    options:
      cache: false
      runInCI: true

  loom-vb-mrwe6-atomic-index:
