# TLA+ TLC model checking tasks
# These tasks run formal verification using the TLA+ model checker (TLC)

fileGroups:
  tla_sources:
    - 'verification/tla/specs/**/*.tla'
    - 'verification/tla/specs/**/*.cfg'
  tla_scripts:
    - 'scripts/**/*.sh'

tasks:
  verify-tlc:
    script: |
      set -euo pipefail
      mkdir -p target/tlc-tmp
      mkdir -p target/moon-locks
      # Run TLC model checker on all TLA+ specifications
      # Using find to locate all .tla files and run TLC on each
      for spec in verification/tla/specs/*.tla; do
        if [ -f "$spec" ]; then
          echo "Checking TLC model: $spec"
          TMPDIR="$PWD/target/tlc-tmp" flock --shared target/moon-locks/source-mutation.lock \
            java -jar tla2tools.jar -terse -death -config "$(echo $spec | sed 's/\.tla$/.cfg/')" "$spec"
        fi
      done
    toolchains:
      - rust
    inputs:
      - '@globs(tla_sources)'
      - '@globs(tla_scripts)'
    options:
      runInCI: true
      cache: false

  verify-tlc-workflow:
    script: |
      set -euo pipefail
      mkdir -p target/tlc-tmp
      mkdir -p target/moon-locks
      # Model check the core workflow specification
      TMPDIR="$PWD/target/tlc-tmp" flock --shared target/moon-locks/source-mutation.lock \
        java -jar tla2tools.jar -terse -death -config verification/tla/specs/WorkflowBoundedAdmission.cfg \
        verification/tla/specs/WorkflowBoundedAdmission.tla
    toolchains:
      - rust
    inputs:
      - 'verification/tla/specs/WorkflowBoundedAdmission.tla'
      - 'verification/tla/specs/WorkflowBoundedAdmission.cfg'
    options:
      runInCI: true
      cache: false

  verify-tlc-idempotency:
    script: |
      set -euo pipefail
      mkdir -p target/tlc-tmp
      mkdir -p target/moon-locks
      # Model check the idempotency safety specification
      TMPDIR="$PWD/target/tlc-tmp" flock --shared target/moon-locks/source-mutation.lock \
        java -jar tla2tools.jar -terse -death -config verification/tla/specs/IdempotencySafety.cfg \
        verification/tla/specs/IdempotencySafety.tla
    toolchains:
      - rust
    inputs:
      - 'verification/tla/specs/IdempotencySafety.tla'
      - 'verification/tla/specs/IdempotencySafety.cfg'
    options:
      runInCI: true
      cache: false
