# Verus proof verification tasks
# These tasks run formal verification using the Verus proof engine

fileGroups:
  verus_sources:
    - 'crates/vb_core/src/**/*'
    - 'verification/verus/**/*'
    - 'verification/kani/**/*.rs'
  verus_specs:
    - 'verification/verus/**/*.rs'

tasks:
  verify-verus:
    script: |
      set -euo pipefail
      mkdir -p target/verus-tmp
      mkdir -p target/moon-locks
      TMPDIR="$PWD/target/verus-tmp" flock --shared target/moon-locks/source-mutation.lock env -u RUSTC_WRAPPER RUSTFLAGS="-Dwarnings" timeout 120m rustup run nightly-2026-04-28 cargo verus --lib -p vb_core --all-features
    toolchains:
      - rust
    inputs:
      - '@globs(verus_sources)'
      - '@globs(verus_specs)'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
    options:
      runInCI: true
      cache: false

  verify-verus-all:
    script: |
      set -euo pipefail
      mkdir -p target/verus-tmp
      mkdir -p target/moon-locks
      TMPDIR="$PWD/target/verus-tmp" flock --shared target/moon-locks/source-mutation.lock env -u RUSTC_WRAPPER RUSTFLAGS="-Dwarnings" timeout 180m rustup run nightly-2026-04-28 cargo verus --all --workspace --all-features
    toolchains:
      - rust
    inputs:
      - '@globs(verus_sources)'
      - '@globs(verus_specs)'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
    options:
      runInCI: false
      cache: false
