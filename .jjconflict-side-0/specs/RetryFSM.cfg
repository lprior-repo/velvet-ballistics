SPECIFICATION Spec

CONSTANT
    (* FIXED: Changed RunId from {1} to {1, 2} to enable cross-run interference testing.
     * Original toy bound {1} could not detect bugs where one run's state affected another. *)
    RunId = {1, 2}
    StepId = {1, 2}
    MaxAttemptsValue = 2

INVARIANT
    TypeOK

INVARIANT
    NoDoubleRetryAfterExhaustion

INVARIANT
    RetryExhaustionIsTyped

INVARIANT
    NoSilentSaturation

INVARIANT
    FramePCResetOnRetry

(* Liveness: eventually terminal or exhausted *)
PROPERTY
    EventuallyTerminalOrExhausted

(* FIXED: CHECK_DEADLOCK FALSE — TerminalStutter is always enabled in terminal states,
 * so deadlock checking would never fire. Setting FALSE prevents false positives. *)
CHECK_DEADLOCK
    FALSE
