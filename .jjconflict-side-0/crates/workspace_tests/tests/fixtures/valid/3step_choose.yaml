# 3-Step Choose Workflow Fixture
# Valid workflow demonstrating choice/conditional step execution
---
version: 1
name: "three_step_choose"
description: "A workflow with three steps demonstrating choice semantics"

when: "always"

inputs:
  env:
    type: string
    default: "prod"

vars:
  retry_count:
    type: integer
    value: 3

secrets:
  - api_key
  - db_password

steps:
  - id: step_init
    name: "Initialize"
    run:
      action: "initialize"
      config:
        timeout: 30
    output:
      result: "init_result"

  - id: step_choose
    name: "Choose Environment"
    choose:
      condition: "${inputs.env}"
      branches:
        prod:
          target: "step_deploy"
        staging:
          target: "step_deploy"
        default:
          target: "step_cleanup"
    output:
      selected: "branch_used"

  - id: step_deploy
    name: "Deploy"
    run:
      action: "deploy"
      target: "production"
    depends_on:
      - "step_init"
    output:
      deployment_id: "deploy_result"

result:
  output:
    status: "success"
    steps_completed: "${steps.step_*.id}"
