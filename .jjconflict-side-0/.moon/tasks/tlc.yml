# TLA+ TLC model checking tasks
# These tasks run formal verification using the TLA+ model checker (TLC)

fileGroups:
  tla_sources:
    - 'verification/tla/*.tla'
    - 'verification/tla/*.cfg'
    - 'verification/tla/specs/**/*.tla'
    - 'verification/tla/specs/**/*.cfg'
  tla_scripts:
    - 'scripts/**/*.sh'

tasks:
  verify-tlc:
    script: |
      set -euo pipefail
      mkdir -p target/tlc-tmp
      mkdir -p target/moon-locks
      if command -v tlc >/dev/null 2>&1; then
        TLC=(tlc)
      elif [ -n "${TLA2TOOLS_JAR:-}" ] && [ -f "$TLA2TOOLS_JAR" ]; then
        TLC=(java -jar "$TLA2TOOLS_JAR")
      else
        echo "Missing TLC runner: install a tlc wrapper or set TLA2TOOLS_JAR to an existing tla2tools.jar" >&2
        exit 127
      fi
      # Run the fail-closed CI baseline root models. Heavier exploratory specs stay
      # outside this CI task until they have bounded, time-safe configs.
      for spec in \
        verification/tla/WorkflowBoundedAdmission.tla \
        verification/tla/IdempotencySafety.tla
      do
        cfg="${spec%.tla}.cfg"
        if [ ! -f "$spec" ]; then
          echo "Missing TLC spec: $spec" >&2
          exit 1
        fi
        if [ ! -f "$cfg" ]; then
          echo "Missing TLC config for $spec: $cfg" >&2
          exit 1
        fi
        model_name="${spec##*/}"
        model_name="${model_name%.tla}"
        meta_dir="$PWD/target/tlc-tmp/verify-tlc-${model_name}-$$"
        rm -rf "$meta_dir"
        mkdir -p "$meta_dir"
        echo "Checking TLC model: $spec"
        TMPDIR="$PWD/target/tlc-tmp" flock --exclusive target/moon-locks/tlc-runner.lock \
          "${TLC[@]}" -terse -metadir "$meta_dir" -config "$cfg" "$spec"
      done
    toolchains:
      - rust
    inputs:
      - '@globs(tla_sources)'
      - '@globs(tla_scripts)'
    options:
      runInCI: true
      cache: false

