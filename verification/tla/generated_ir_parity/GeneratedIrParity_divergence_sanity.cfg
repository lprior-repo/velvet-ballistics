SPECIFICATION Spec
CONSTANTS
  MaxStep = 1
  MaxSlot = 1
  MaxEvent = 2
  MaxU64 = 0
  ActionIds = {act_a}
  TaintVals = {"clean", "tainted_a"}
  None = NULL
  MaxTicket = 0
  MaxRetry = 0
  \* "ask" is unsupported; candidateFault=TRUE injects generated mismatch
  \* to prove ObservationRefinesOracle can fail (non-vacuous sanity)
  UnsupportedKind = "ask"
  candidateFault = TRUE
INVARIANT SameBlockedMetadata
INVARIANT NoAdvancePastSuspension
INVARIANT ValidStepStateTransitions
INVARIANT UnsupportedNoSourceEmission
INVARIANT SameObservableStateWhenTerminal
INVARIANT SameJournalPrefix
INVARIANT ObservationRefinesOracle
INVARIANT StateConstraint
PROPERTY EventuallyTerminalOrBlockedOrTypedError
PROPERTY ResumeEventuallyProgresses
CHECK_DEADLOCK TRUE
