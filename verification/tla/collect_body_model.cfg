SPECIFICATION Spec
\* Model checking: check NodeCountInvariant, OffsetInvariant, NodeKindInvariant, NoOverflowInvariant
INVARIANT NodeCountInvariant
INVARIANT OffsetInvariant
INVARIANT NodeKindInvariant
INVARIANT NoOverflowInvariant
INVARIANT TypeOK

\* Temporal property: eventually done for valid ids
TEMPORAL_PROPS CollectLowersToDone
TEMPORAL_PROPS NoEarlyDone

\* Initialization constraint
INIT Init

\* Step bound for model checking
CONSTANTS
  MaxStepIdx = 65535

\* Check behavior for all valid starting IDs in range [0, 65532]
\* (65532 + 3 = 65535 = u16::MAX, so 65532 is the last valid starting id)
CONSTANT MaxStartId
ASSUME MaxStartId = 65532
