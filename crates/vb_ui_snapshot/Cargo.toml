[package]
name = "vb_ui_snapshot"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "UI snapshot test infrastructure for Velvet Ballistics Makepad screens"
publish = false

[features]
default = ["std"]
std = ["serde/std"]
tokio = ["dep:tokio"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
toml = "0.9"
vb_ui_model = { path = "../vb_ui_model" }
thiserror = "2"
anyhow = "1"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }
tokio = { version = "1", features = ["fs", "process"], optional = true }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
serde_yaml = "0.9"

[lints]
workspace = true

[dev-dependencies]
 tempfile = { workspace = true }
