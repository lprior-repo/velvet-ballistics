[package]
name = "vb_compile"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
blake3.workspace = true
postcard.workspace = true
saphyr.workspace = true
saphyr-parser.workspace = true
thiserror.workspace = true
vb_core = { path = "../vb_core", features = ["test-util"] }
vb_validate = { path = "../vb_validate" }
vb_yaml = { path = "../vb_yaml" }

[dev-dependencies]
proptest.workspace = true
vb_yaml = { path = "../vb_yaml", features = ["test-util"] }

[features]
default = []
test-util = []
kani-nested-foreach = []

[lints]
workspace = true

[[test]]
name = "vb_xi2f_compile_source_proptest"
path = "tests/vb_xi2f_compile_source_proptest.rs"

[[test]]
name = "vb_xi2f_error_variant_proptest"
path = "tests/vb_xi2f_error_variant_proptest.rs"

[[test]]
name = "proptest_digest_foreach"
path = "tests/proptest_digest_foreach.rs"

# === vb-xi2f.13 Choose Lowering Proptest Targets ===

[[test]]
name = "proptest_choose_width"
path = "tests/proptest/proptest_choose_width.rs"

[[test]]
name = "proptest_choose_fallthrough"
path = "tests/proptest/proptest_choose_fallthrough.rs"

[[test]]
name = "proptest_choose_otherwise"
path = "tests/proptest/proptest_choose_otherwise.rs"

[[test]]
name = "proptest_choose_depth"
path = "tests/proptest/proptest_choose_depth.rs"

[[test]]
name = "proptest_choose_emission"
path = "tests/proptest/proptest_choose_emission.rs"

# === vb-pkif2: Save canonical name & digest prefix proptest targets ===

[[test]]
name = "proptest_save_canonical_name"
path = "tests/proptest_save_canonical_name.rs"

[[test]]
name = "proptest_save_digest_prefix"
path = "tests/proptest_save_digest_prefix.rs"
