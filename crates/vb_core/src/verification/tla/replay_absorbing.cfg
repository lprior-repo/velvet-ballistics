\* PO-TLA-001: Replay absorbing terminal states — TLC model configuration
\* GOD RULE 3: Bounded arithmetic — uses U64 bounds, not unbounded Nat.

SPECIFICATION Spec

\* Constants (bounded to match production limits)
CONSTANTS
    MaxSteps      = 8       \* Bounded step count for model checking
    MaxIterations = 4       \* Replay iteration limit
    MaxExecuted   = 65536  \* Bounded for TLC (U64::MAX too large for model checking)

\* Invariants to check
INVARIANT
    TerminalStatesNeverReexecuted
    Invariant_TerminalAbsorbing
    ExecutedBounded
    StepsNeverMutated

\* Properties to check
PROPERTY
    ReplayCompletes

\* Model-checking options
CHECK_DEADLOCK FALSE
