version: velvet-ballistics/v1
name: nested_join_minimal
when: {manual: {}}
vars: {empty_list: []}
steps:
  - id: outer
    together:
      branches:
        - label: outer_branch
          steps:
            - id: inner
              set: {output: value, value: 'append($vars.empty_list, 7)'}
  - id: done
    finish: {result: '$step.outer'}
