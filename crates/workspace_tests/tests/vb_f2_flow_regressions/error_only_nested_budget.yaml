version: velvet-ballistics/v1
name: probe
when: {manual: {}}
inputs: {divisor: number}
steps:
  - id: seed
    set: {output: seed, value: '42'}
  - id: fault
    then: done
    on_error: {handler: recovery}
    set: {output: quotient, value: '1 / $input.divisor'}
  - id: recovery
    together:
      branches:
        - label: first
          steps:
            - id: one
              set: {output: one, value: '1'}
        - label: second
          steps:
            - id: other
              set: {output: other, value: '3'}
        - label: third
          steps:
            - id: three
              set: {output: three, value: '4'}
        - label: fourth
          steps:
            - id: four
              set: {output: four, value: '5'}
  - id: done
    finish: {result: '$seed'}
