version: velvet-ballistics/v1
name: probe
when: {manual: {}}
inputs: {divisor: number}
steps:
  - id: outer
    on_error: {handler: recovery}
    together:
      branches:
        - label: failing
          steps:
            - id: fault
              set: {output: quotient, value: '1 / $input.divisor'}
  - id: recovery
    together:
      branches:
        - label: recovered
          steps:
            - id: answer
              set: {output: answer, value: '42'}
  - id: done
    finish: {result: '$step.recovery'}
