[package]
name = "velvet_ballastics"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
vb_compile = { path = "../vb_compile" }
vb_core = { path = "../vb_core" }
vb_codegen = { path = "../vb_codegen" }
vb_expr = { path = "../vb_expr" }
vb_ipc = { path = "../vb_ipc" }
vb_runtime = { path = "../vb_runtime" }
vb_storage = { path = "../vb_storage" }
vb_validate = { path = "../vb_validate" }
vb_yaml = { path = "../vb_yaml" }
postcard = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["alloc"] }
serde-saphyr = { workspace = true }
chrono.workspace = true

[lib]
name = "velvet_ballastics"
path = "src/lib.rs"

[[bin]]
name = "velvet-ballastics"
path = "src/main.rs"

[[bin]]
name = "vb"
path = "src/vb.rs"

[dev-dependencies]
bytes = { workspace = true }
proptest = { workspace = true }
serde = { workspace = true }
tempfile.workspace = true
vb_ui_model = { path = "../vb_ui_model" }

[lints]
workspace = true
