[package]
name = "velvet_ballastics"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
vb_compile = { path = "../vb_compile", optional = true }
vb_core = { path = "../vb_core", optional = true }
vb_codegen = { path = "../vb_codegen", optional = true }
vb_expr = { path = "../vb_expr", optional = true }
vb_ipc = { path = "../vb_ipc", optional = true }
vb_runtime = { path = "../vb_runtime", optional = true }
vb_storage = { path = "../vb_storage", optional = true }
vb_validate = { path = "../vb_validate", optional = true }
vb_yaml = { path = "../vb_yaml", optional = true }
postcard = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, features = ["alloc"], optional = true }
serde-saphyr = { workspace = true, optional = true }

[features]
default = []
bin-deps = [
    "dep:postcard",
    "dep:serde",
    "dep:serde-saphyr",
    "dep:serde_json",
    "dep:vb_codegen",
    "dep:vb_compile",
    "dep:vb_core",
    "dep:vb_expr",
    "dep:vb_ipc",
    "dep:vb_runtime",
    "dep:vb_storage",
    "dep:vb_validate",
    "dep:vb_yaml",
]

[[bin]]
name = "velvet-ballistics"
path = "src/main.rs"
required-features = ["bin-deps"]

[[bin]]
name = "vb"
path = "src/vb_main.rs"
required-features = ["bin-deps"]

[dev-dependencies]
bytes = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["alloc"] }
tempfile.workspace = true
vb_codegen = { path = "../vb_codegen" }
vb_compile = { path = "../vb_compile" }
vb_core = { path = "../vb_core" }
vb_expr = { path = "../vb_expr" }
vb_ipc = { path = "../vb_ipc" }
vb_runtime = { path = "../vb_runtime" }
vb_storage = { path = "../vb_storage" }
vb_validate = { path = "../vb_validate" }
vb_yaml = { path = "../vb_yaml" }

[lints]
workspace = true
