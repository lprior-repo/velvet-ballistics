[package]
name = "vb_runtime"
edition.workspace = true
license.workspace = true
version.workspace = true

[package.metadata.flux]
enabled = true
include = [
  "src/verification/flux/vb_mrwe6_*_refinements.rs",
  "src/verification/flux/vb_egysa*_refinements.rs",
  "src/verification/mrwe6_flux/*.rs",
]

[dependencies]
blake3.workspace = true
chrono.workspace = true
crossbeam-queue.workspace = true
indexmap.workspace = true
loom = { version = "0.7", optional = true }
rtrb.workspace = true
thiserror.workspace = true
vb_core = { path = "../vb_core" }
vb_storage = { path = "../vb_storage" }
postcard.workspace = true
serde.workspace = true
flux-rs = { git = "https://github.com/flux-rs/flux", rev = "4d329f2", package = "flux-rs", optional = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile.workspace = true
vb_core = { path = "../vb_core", features = ["test-util"] }

[features]
default = []
test-util = ["vb_core/test-util"]
loom = ["dep:loom"]
kani-admission-store = []
kani-capability-harnesses = []
kani-collect-pagination = []
kani-engine-yaml-admission = []
kani-reentry-proofs = []
kani-shard-command-queue = []
kani-trace-ring = []
kani-vt2f-runtime-facade = []
kani-vt2f-shard-lower-semantics = []
kani-yaml-e2e-admission-matrix = []
vb-y9d3v-attempt-fence = []
vb-y9d3v-flux-refinements = []
vb-mrwe6-flux-refinements = ["dep:flux-rs", "vb_storage/vb-mrwe6-flux-refinements"]
vb-egysa-flux-refinements = ["dep:flux-rs"]
vb-mrwe6-flux-negative-probes = []
vb-rxru0-flux-refinements = []
vb-rxru0-mock-marker = []

[lints]
workspace = true
