[package]
name = "vb_ui"
version = "0.1.0"
edition = "2024"

[lib]
name = "vb_ui"
path = "src/lib.rs"

[[bin]]
name = "vb-ui"
path = "src/main.rs"

[dependencies]
makepad-widgets = { git = "https://github.com/makepad/makepad", rev = "20b6c53b6f229b165fe7f813504ae93405159d27" }
vb_ipc = { path = "../vb_ipc" }
vb_core = { path = "../vb_core" }
vb_storage = { path = "../vb_storage" }
vb_ui_model = { path = "../vb_ui_model" }
postcard = { version = "1", features = ["alloc"] }
seahash = "4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
smol_str = { version = "0.3", features = ["serde"] }
indexmap = "2"

[lints]
workspace = true
