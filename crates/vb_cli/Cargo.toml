[package]
name = "velvet-ballistics"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
vb_compile = { path = "../vb_compile" }
vb_core = { path = "../vb_core" }
vb_expr = { path = "../vb_expr" }
vb_ipc = { path = "../vb_ipc" }
vb_runtime = { path = "../vb_runtime" }
vb_storage = { path = "../vb_storage" }
vb_validate = { path = "../vb_validate" }
vb_yaml = { path = "../vb_yaml" }
postcard = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["alloc"] }
serde-saphyr = { workspace = true }
chrono.workspace = true
crc32fast.workspace = true
blake3.workspace = true
rustix.workspace = true

[lib]
name = "vb_cli"
path = "src/lib.rs"

[[bin]]
# Binary name contract: see velvet-ballistics-MASTER.md §33.6.
name = "velvet-ballistics"
path = "src/main.rs"

[dev-dependencies]
bytes = { workspace = true }
proptest = { workspace = true }
serde = { workspace = true }
tempfile.workspace = true
# allow-removed-crate: deferred-scope fence marker, not an active workspace member
# vb_ui_model is removed from the current workspace scope.

[lints]
workspace = true
