[package]
name = "vb_storage"
edition.workspace = true
license.workspace = true
version.workspace = true

[package.metadata.flux]
enabled = true
include = [
  "src/verification/flux/vb_mrwe6_*_refinements.rs",
  "src/mrwe6_flux_storage/*.rs",
  "src/journal/append/intent.rs",
  "src/journal/append/decision.rs",
  "src/verification/flux/vb_7ol6y_recovered_slot_taint.rs",
  "src/verification/flux/vb_7ol6y_slot_taint_resolution.rs",
  "src/verification/flux/vb_7ol6y_legacy_none.rs",
  "src/verification/flux/vb_7ol6y_workflow_invariants.rs",
]

[dependencies]
arrayvec.workspace = true
blake3.workspace = true
chrono.workspace = true
crc32c.workspace = true
fjall.workspace = true
postcard.workspace = true
rustix.workspace = true
serde.workspace = true
thiserror.workspace = true
vb_core = { path = "../vb_core" }
flux-rs = { git = "https://github.com/flux-rs/flux", rev = "4d329f2", package = "flux-rs", optional = true }
loom = { version = "0.7", optional = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile.workspace = true

[features]
default = []
legacy-kani = []
kani-digest-checks-vb-2bzz = []
kani-typed-partitioned-ids = []
kani-storage-trailing-bytes = []
kani-vb-u8gi-decode-taxonomy = []
kani-vb-vzcuf = []
kani-vb-h09wf = []
kani-vb-mrwe5 = []
kani-vb-fn4vt = []
kani-vb-mrwe6 = []
# HVR-PO-STORAGE-002/HVR-PO-STORAGE-005: isolate vb-god2f storage Kani harnesses.
kani-vb-god2f-hard-verus = []
kani-vb-mrwe-7 = []
loom-vb-mrwe-7 = ["dep:loom"]
vb-mrwe6-flux-refinements = ["dep:flux-rs"]
vb-mrwe6-flux-negative-probes = []
test-support = []
# Enable fuzzing support modules (fuzz_access) for use with cargo-fuzz
fuzzing = []
# vb-7ol6y: Recovery hydration fail-closed bugs (P0).
# Activates kani_vb_7ol6y_recovery_hydrate.rs harnesses.
kani-vb-7ol6y = []
# vb-7ol6y: Enable flux analysis of the recovery hydration refinement files.
vb-7ol6y-flux-refinements = ["dep:flux-rs"]

[lints]
workspace = true
