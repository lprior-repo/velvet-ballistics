[package]
name = "velvet-ballastics-fuzz"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
autobins = false

[workspace]

[package.metadata]
# NOTE: cargo-fuzz requires `cargo-fuzz = true` here for manifest detection.
# The `[package.metadata.cargo-fuzz]` subtable is the documented place for
# libfuzzer options, but Cargo's TOML parser rejects both `[package.metadata]`
# with a `cargo-fuzz` key AND `[package.metadata.cargo-fuzz]` as a subtable.
# Minimization config (sancov_timeout, libfuzzer_options) is applied via
# the `fuzz-smoke` Moon task and `scripts/fuzz-minimization.sh` instead.
cargo-fuzz = true

[features]
fuzz = []

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[dependencies]
libfuzzer-sys = "0.4"
postcard = { version = "1", features = ["alloc"] }
blake3 = "1"
bytes = { version = "1", features = ["serde"] }
tempfile = "3"
vb_boundary_inventory = { path = "../crates/vb_boundary_inventory" }
vb_core = { path = "../crates/vb_core" }
vb_expr = { path = "../crates/vb_expr" }
vb_storage = { path = "../crates/vb_storage" }
vb_runtime = { path = "../crates/vb_runtime" }
vb_validate = { path = "../crates/vb_validate" }
vb_yaml = { path = "../crates/vb_yaml" }
vb_compile = { path = "../crates/vb_compile" }
vb_ipc = { path = "../crates/vb_ipc" }
vb_ui_model = { path = "../crates/vb_ui_model" }

[lib]
name = "fuzz_lib"
path = "src/lib.rs"

[package.metadata.cargo-machete]
ignored = ["bytes"]

