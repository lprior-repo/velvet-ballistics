[package]
name = "velvet-ballistics-fuzz"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
autobins = false

[workspace]

[package.metadata]
# NOTE: cargo-fuzz requires `cargo-fuzz = true` here for manifest detection.
# The `[package.metadata.cargo-fuzz]` subtable is the documented place for
# libfuzzer options, but Cargo's TOML parser rejects both `[package.metadata]`
# with a `cargo-fuzz` key AND `[package.metadata.cargo-fuzz]` as a subtable.
# Minimization config (sancov_timeout, libfuzzer_options) is applied via
# the `fuzz-smoke` Moon task and `scripts/fuzz-minimization.sh` instead.
cargo-fuzz = true

[features]
fuzz = []
test-util = []

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unreachable_pub = "deny"
rust_2018_idioms = "deny"

[lints.clippy]
correctness = "deny"
suspicious = "deny"
perf = "deny"
complexity = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
let_underscore_must_use = "deny"
await_holding_lock = "deny"

[dependencies]
libfuzzer-sys = "0.4"
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
blake3 = "1"
bytes = { version = "1", features = ["serde"] }
tempfile = "3"
vb_core = { path = "../crates/vb_core" }
vb_storage = { path = "../crates/vb_storage" }
vb_runtime = { path = "../crates/vb_runtime" }
vb_validate = { path = "../crates/vb_validate" }
vb_compile = { path = "../crates/vb_compile", features = ["test-util"] }
vb_ipc = { path = "../crates/vb_ipc" }

xtask = { path = "../xtask" }
crc32c = "0.6"

[dev-dependencies]
proptest = "1"

[lib]
name = "fuzz_lib"
path = "src/lib.rs"

[package.metadata.cargo-machete]
ignored = ["bytes"]

# === Fuzz profile (Phase 0) ===
[profile.fuzz]
inherits = "release"
debug = true
debug-assertions = true
overflow-checks = true
lto = "off"
opt-level = 2
codegen-units = 1
incremental = false

