[package]
name = "velvet-ballastics-fuzz"
version = "0.1.0"
edition = "2024"
publish = false

[features]
fuzz = []

[lints]
workspace = true

[dependencies]
bytes.workspace = true
postcard.workspace = true
vb_compile = { path = "../crates/vb_compile" }
vb_core = { path = "../crates/vb_core" }
vb_expr = { path = "../crates/vb_expr" }
vb_ipc = { path = "../crates/vb_ipc" }
vb_storage = { path = "../crates/vb_storage" }
vb_yaml = { path = "../crates/vb_yaml" }

[lib]
name = "fuzz_lib"
path = "src/lib.rs"

[[bin]]
name = "workflow_parse"
path = "src/bin/workflow_parse.rs"

[[bin]]
name = "workflow_compile"
path = "src/bin/workflow_compile.rs"

[[bin]]
name = "slot_value_roundtrip"
path = "src/bin/slot_value_roundtrip.rs"

[[bin]]
name = "binary_ipc_frame"
path = "src/bin/binary_ipc_frame.rs"

[[bin]]
name = "fjall_journal_append"
path = "src/bin/fjall_journal_append.rs"
