[package]
name = "velvet-ballastics-fuzz"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
autobins = false

[workspace]

[package.metadata]
cargo-fuzz = true

[features]
fuzz = []

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[dependencies]
libfuzzer-sys = "0.4"
postcard = { version = "1", features = ["alloc"] }
blake3 = "1"
bytes = { version = "1", features = ["serde"] }
tempfile = "3"
vb_boundary_inventory = { path = "../crates/vb_boundary_inventory" }
vb_core = { path = "../crates/vb_core" }
vb_expr = { path = "../crates/vb_expr" }
vb_storage = { path = "../crates/vb_storage" }
vb_runtime = { path = "../crates/vb_runtime" }
vb_validate = { path = "../crates/vb_validate" }
vb_yaml = { path = "../crates/vb_yaml" }
vb_compile = { path = "../crates/vb_compile" }
vb_ipc = { path = "../crates/vb_ipc" }

[lib]
name = "fuzz_lib"
path = "src/lib.rs"

[[bin]]
name = "vb_f04l_yaml_compiler_compile"
path = "fuzz_targets/vb_f04l_yaml_compiler_compile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vb_qi37_12_persisted_payload_decode"
path = "src/bin/vb_qi37_12_persisted_payload_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "journal_event"
path = "fuzz_targets/journal_event.rs"
test = false
doc = false
bench = false

[[bin]]
name = "capability_name_schema"
path = "fuzz_targets/capability_name_schema.rs"
test = false
doc = false
bench = false

[[bin]]
name = "capability_contract_schema"
path = "fuzz_targets/capability_contract_schema.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compiled_ir"
path = "fuzz_targets/compiled_ir.rs"
test = false
doc = false
bench = false

[[bin]]
name = "expression"
path = "fuzz_targets/expression.rs"
test = false
doc = false
bench = false

[[bin]]
name = "generated_compare"
path = "fuzz_targets/generated_compare.rs"
test = false
doc = false
bench = false

[[bin]]
name = "collect_page"
path = "fuzz_targets/collect_page.rs"
test = false
doc = false
bench = false

[[bin]]
name = "yaml_events"
path = "src/bin/yaml_events.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ipc_frame"
path = "fuzz_targets/ipc_frame.rs"
test = false
doc = false
bench = false
