# cargo-vet configuration for Velvet Ballistics
# Supply-chain verification for trusted dependencies

# Default policy: treat all crates as audit-as-crates-io unless explicitly trusted
[policy]
# Only first-party crates (in the workspace) get audit-as-crates-io
"vb_codegen" = { audit-as-crates-io = true }
"vb_compile" = { audit-as-crates-io = true }
"vb_core" = { audit-as-crates-io = true }
"vb_expr" = { audit-as-crates-io = true }
"vb_ipc" = { audit-as-crates-io = true }
"vb_runtime" = { audit-as-crates-io = true }
"vb_storage" = { audit-as-crates-io = true }
"vb_validate" = { audit-as-crates-io = true }
"vb_yaml" = { audit-as-crates-io = true }
"velvet-ballastics" = { audit-as-crates-io = true }
"velvet-ballastics-workspace" = { audit-as-crates-io = true }
"velvet-ballastics-fuzz" = { audit-as-crates-io = true }



# Git packages that match crates.io versions need explicit audit-as-crates-io = false
# These are transitive dependencies from makepad platform and other git-sourced crates
