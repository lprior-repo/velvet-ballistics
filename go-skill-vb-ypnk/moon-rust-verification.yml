# Moon verification gauntlet task template.
# Copy these tasks into `.moon/tasks/all.yml` or import/adapt them for a
# project-specific Moon file. This repo already wires the same task names in
# `.moon/tasks/all.yml`.

tasks:
  verify-fast:
    command: 'bash scripts/rust-verification-gauntlet.sh fast'
    options:
      cache: false
      runInCI: false

  verify-standard:
    command: 'bash scripts/rust-verification-gauntlet.sh standard'
    options:
      cache: false
      runInCI: false

  verify-deep:
    command: 'bash scripts/rust-verification-gauntlet.sh deep'
    options:
      cache: false
      runInCI: false

  verify-proof:
    command: 'bash scripts/rust-verification-gauntlet.sh proof'
    options:
      cache: false
      runInCI: false

  verify-all:
    command: 'bash scripts/rust-verification-gauntlet.sh all'
    options:
      cache: false
      runInCI: false
