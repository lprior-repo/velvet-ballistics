[workspace]
members = [
    "crates/vb_boundary_inventory",
    "crates/vb_core",
    "crates/vb_yaml",
    "crates/vb_validate",
    "crates/vb_expr",
    "crates/vb_compile",
    "crates/vb_storage",
    "crates/vb_runtime",
    "crates/vb_doc",
    "crates/vb_ipc",
    # Deferred crates moved to https://github.com/lprior-repo/velvet-optional:
    # crates/vb_codegen, crates/vb_ui, crates/vb_ui_makepad, crates/vb_ui_model, crates/vb_ui_snapshot
    "crates/vb_proof_kernels",
    "crates/vb_cli",
    "crates/vb_verification",
    "crates/workspace_tests/idempotency_suite",
    # workspace_tests excluded (depends on deferred vb_ui/vb_codegen types)
    # "crates/workspace_tests",
    "crates/vb_benchmark",
    # xtask excluded (depends on deferred UI crates in velvet-optional)
    # "xtask",
]
default-members = ["."]
resolver = "2"
exclude = ["target/miri-tmp", "fuzz"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
arrayvec = "0.7"
blake3 = "1"
byteorder = "1.5"
bytes = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
crc32c = "0.6"
crc32fast = "1"
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
criterion = "0.8"
trybuild = "1"
fjall = { version = "3.1", default-features = false, features = ["lz4"] }
indoc = "2"
indexmap = "2"
logos = "0.15"
libfuzzer-sys = "0.4"
mio = "1"
postcard = { version = "1", features = ["alloc"] }
proptest = "1"
rand = "0.9"
rtrb = "0.3"
rustix = { version = "1", features = ["fs"] }
saphyr = { version = "=0.0.6", default-features = false }
saphyr-parser = "=0.0.6"
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde-saphyr = { version = "=0.0.25", default-features = false, features = ["deserialize", "serialize"] }
serde_json = { version = "1", default-features = false, features = ["std", "alloc"] }
serde_yaml = "0.9"
thiserror = "2"
tempfile = "3"
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(loom)', 'cfg(verus_keep_ghost)', 'cfg(docsrs,test)'] }

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
let_underscore_must_use = "deny"
await_holding_lock = "deny"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
result_large_err = "warn"
