[workspace]
members = [
    "crates/vb_cli",
    "crates/vb_compile",
    "crates/vb_core",
    "crates/vb_ipc",
    "crates/vb_queue_semantics",
    "crates/vb_runtime",
    "crates/vb_storage",
    "crates/vb_validate",
    "crates/workspace_tests",
]
resolver = "2"
exclude = ["target/miri-tmp", "crates/vb_ui", "fuzz"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
arrayvec = "0.7"
blake3 = "1"
byteorder = "1.5"
bytes = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
crc32c = "0.6"
crc32fast = "1"
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
criterion = "0.8"
trybuild = "1"
fjall = { version = "=3.1.4", default-features = false, features = ["lz4"] }
indoc = "2"
indexmap = "2"
logos = "0.15"
libfuzzer-sys = "0.4"
mio = "1"
postcard = { version = "1", features = ["alloc"] }
proptest = "1"
rand = "0.9"
rtrb = "0.3"
rustix = { version = "1", features = ["fs"] }
saphyr = { version = "=0.0.6", default-features = false }
saphyr-parser = "=0.0.6"
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde-saphyr = { version = "=0.0.25", default-features = false, features = ["deserialize", "serialize"] }
serde_json = { version = "1", default-features = false, features = ["std", "alloc"] }
serde_yaml = "0.9"
thiserror = "2"
tempfile = "3"
toml = "0.9"

[workspace.lints.rust]
warnings = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unused_results = "deny"
let_underscore_drop = "deny"
elided_lifetimes_in_paths = "deny"
explicit_outlives_requirements = "deny"
missing_debug_implementations = "deny"
missing_docs = "deny"
unreachable_pub = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
unused_extern_crates = "deny"
unused_import_braces = "deny"
keyword_idents_2024 = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "deny"
private_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
missing_crate_level_docs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
unwrap_in_result = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
integer_division = "deny"
integer_division_remainder_used = "deny"
modulo_arithmetic = "deny"
float_arithmetic = "deny"
result_large_err = "deny"
result_unit_err = "deny"
map_err_ignore = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
missing_safety_doc = "deny"
large_enum_variant = "deny"
cognitive_complexity = "deny"
too_many_arguments = "deny"
too_many_lines = "deny"
type_complexity = "deny"
excessive_nesting = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
future_not_send = "deny"
large_futures = "deny"
disallowed_methods = "deny"
disallowed_macros = "deny"
disallowed_types = "deny"
disallowed_fields = "deny"
multiple_crate_versions = "deny"
wildcard_dependencies = "deny"
negative_feature_names = "deny"
redundant_feature_names = "deny"
let_underscore_must_use = "deny"


[profile.hardened]
inherits = "release"
codegen-units = 1
debug = "line-tables-only"
lto = "thin"
overflow-checks = true
panic = "abort"
strip = "symbols"

[profile.maxperf]
inherits = "release"
opt-level = 3
codegen-units = 1
debug = false
debug-assertions = false
lto = "fat"
overflow-checks = true
strip = "symbols"

