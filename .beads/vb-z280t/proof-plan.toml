kani_artifact      = "crates/vb_proof_kernels/src/verification/kani/resource_budget_loop_mul.rs (new)"
proptest_artifact  = "crates/vb_proof_kernels/tests/proptest_resource_budget.rs (new)"
proof_obligations_yaml_additions = [
  "id=obl-vb-core-resource-verus-005 (saturating bridge)",
  "id=obl-vb-core-resource-kani-006 (boundary u64 inputs)",
  "id=obl-vb-core-resource-proptest-007 (sat_mul roundtrip)",
]

