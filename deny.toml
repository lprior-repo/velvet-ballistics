# cargo-deny configuration for Velvet Ballistics
# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Banned licenses (enforced via license allowlist + copyleft/default deny):
# GPL-*, LGPL-*, AGPL-*, SSPL-*, Commons Clause

[licenses]
version = 2
# Allow only specific permissive licenses (SPDX identifiers)
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "Unicode-3.0",
    "Zlib",
]

# Banned licenses are denied by default above.
# GPL-*, LGPL-*, AGPL-*, SSPL-*, Commons Clause are not in the allow list.

[bans]

[advisories]
version = 2
ignore = [
    # RUSTSEC-2023-0089: atomic-polyfill is pulled through postcard's heapless
    # 0.7 dependency. There is no safe upgrade in the current postcard line;
    # retain cargo-audit visibility and revisit when postcard moves to a
    # maintained atomic backend.
    "RUSTSEC-2023-0089",
]

[sources]
# Deny unknown registries and git sources
unknown-registry = "deny"
unknown-git = "deny"
# Allow only crates.io
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
