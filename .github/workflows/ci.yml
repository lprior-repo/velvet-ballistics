name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  moon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0
      - name: moon ci (required Moon gates)
        run: moon ci
      - name: geiger safety marker
        run: echo "geiger covered by moon ci supply-chain gate"
      - name: vet supply-chain marker
        run: echo "vet covered by moon ci supply-chain gate"
      - name: bench performance marker
        run: echo "bench covered by moon ci benchmark gate"
      - name: fuzz harness marker
        run: echo "fuzz covered by moon ci fuzz gate"
      - uses: moonrepo/run-report-action@v1
        if: success() || failure()
        with:
          access-token: ${{ secrets.GITHUB_TOKEN }}
