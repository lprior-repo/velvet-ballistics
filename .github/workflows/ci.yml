name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly toolchain
        run: |
          rustup install nightly-2026-04-28
          rustup default nightly-2026-04-28
          rustup component add rustfmt clippy

      - name: Install Moon
        run: |
          curl -fsSL https://moonrepo.dev/install | bash
          moon --version

      - name: Run moon ci
        run: moon ci
