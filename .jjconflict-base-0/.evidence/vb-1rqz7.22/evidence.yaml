source_defect:
  file: crates/vb_storage/src/admission.rs
  function: submit_artifact_with_contracts
  arm: RuntimePolicy::Relaxed
  prior_lines: 336-361
  issue: Relaxed arm wrote CompiledIrRecord via journal.put_compiled_ir and
    returned Ok(artifact) WITHOUT the live readback check that Journaled |
    Strict arms performed at lines 409-414. The Relaxed path therefore
    never verified that the record it just wrote was actually observable.

fix_summary:
  - Added 7 lines (post-edit, including Ok(artifact)) to the Relaxed arm.
    After journal.put_compiled_ir(&record)?, the arm now calls
    journal.compiled_ir(workflow.digest())? and returns
    Err(JournalError::ArtifactMalformed) on either Err or None. This is
    the exact mirror of the Journaled | Strict readback at the prior
    409-414.
  - No forbidden constructs introduced. The error mapping
    `.map_err(|_| JournalError::ArtifactMalformed)?` matches the existing
    pattern in the Journaled | Strict arm; no new error variants added;
    no swallowed Result/Option; no `unwrap`/`expect`/`panic`/`todo`.

files_touched:
  - crates/vb_storage/src/admission.rs (Relaxed arm, lines 359-366)
  - crates/vb_storage/src/admission/tests.rs (new test inserted at line 274)

tests_added:
  - name: submit_artifact_relaxed_performs_immediate_live_readback
    location: crates/vb_storage/src/admission/tests.rs
    purpose: Locks in the Relaxed live-readback invariant. Calls
      submit_artifact with Relaxed policy, verifies the returned artifact
      digest and verification proof shape, then independently calls
      journal.compiled_ir(workflow.digest()) and asserts Some(record)
      with matching digest and non-empty ir bytes. Finally decodes the
      persisted postcard envelope back to AcceptedArtifact and asserts
      the digest survives the readback path.

