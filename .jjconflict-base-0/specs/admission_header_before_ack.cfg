SPECIFICATION Spec

CONSTANTS
    NoCode = NoCode
    HeaderPersistenceFailed = HeaderPersistenceFailed
    QueueFull = QueueFull
    ErrorCodes = {HeaderPersistenceFailed, QueueFull}

INVARIANTS
    TypeOK
    FailurePreventsAck
    DuplicateRejectsNoLiveState
    AckRequiresPersistence
    LiveStateRequiresPersistence
    NoLiveStateBeforeDurableAdmission

PROPERTIES
    FailureEventuallyRejected
    SuccessEventuallyAcked

(* CHECK_DEADLOCK TRUE is intentional here: TerminalStutter action is always enabled in
 * terminal states ("Rejected", "Acked"), so the state graph will never reach a state
 * with zero enabled actions. This prevents false-positive deadlock reports. *)
CHECK_DEADLOCK TRUE
