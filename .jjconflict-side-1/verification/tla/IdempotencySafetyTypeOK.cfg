\* Scenario: TypeOK/base bounded idempotency safety.
SPECIFICATION Spec
CONSTANTS
    MaxRuns = 1
    MaxActions = 1
    MaxSeq = 3
    NullDigest = 0
    Digests = {0, 1}
INVARIANT TypeOK
INVARIANT NoDuplicateJournalEvents
INVARIANT DigestBinding
INVARIANT NoReplayOfResolvedActions
INVARIANT NoSuccessFailureConflict
INVARIANT JournalSeqMonotonicity
INVARIANT SeqWithinBound
CHECK_DEADLOCK TRUE
