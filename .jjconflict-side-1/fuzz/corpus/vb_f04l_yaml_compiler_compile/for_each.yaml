version: velvet-ballistics/v1
name: fuzz_foreach
when:
  manual: {}
inputs:
  items:
    is: list
    of: any
    max: 2
steps:
  - id: loop
    for_each:
      variable: entry
      input: "$input.items"
      at_once: 1
      steps:
        - id: capture
          set:
            output: seen
            value: "1"
  - id: done
    finish:
      result: $input.items
