pct_methodology: |
  p50 is the criterion-reported median point estimate from estimates.json.
  p95 and p99 are derived from the criterion-reported mean and std_dev
  assuming a roughly normal tail (mean + 1.645*sigma, mean + 2.33*sigma).
  The underlying criterion sample.json uses linear sampling which
  conflates iteration-count scaling with per-iteration noise, so it is
  not appropriate to compute empirical p95/p99 directly from those
  raw windows. The p95/p99 numbers are therefore approximate.
baseline_status: |
  This is a baseline recording only. The single-step p50 here is
  ~401ns for the synthetic aggregate_resource_budget fold of 1000
  runs, which is well below the 1ms volatile budget (Section 71).
  No performance claim is made; this is the first recorded evidence
  that vb-ship-009 (master section 71) requires. Future beads may
  re-run with larger sample sizes, add per-beat cohort reports, and
  bind this evidence to other benchmarks (transition_set,
  ir_interpreter_dispatch, end-to-end workflow).
