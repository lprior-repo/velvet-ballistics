  # ============================================================
  # STEP STATE MACHINE (Section 45)
  # ============================================================
  - id: VB-CORE-STATE-001
    section: [45]
    statement: |
      Valid transitions only:
      Pending → Running, Succeeded, Failed, Cancelled, Skipped
      Running → Succeeded, Failed, Waiting, Asking, Cancelled, Skipped
      Waiting → Running
      Asking → Running
      Terminal states (Succeeded, Failed, Cancelled, Skipped) → only themselves
    proof_level: L4
    crate: vb_core
    files:
      - crates/vb_core/src/frame.rs
    required:
      retired_local_verus_model: verification/verus/step_state_machine.rs
      kani: kani_step_state.rs
      tests: [step_state_valid_transitions, step_state_invalid_transitions_rejected]
    commands:
