      - cargo nextest run -p vb_core step_state
    verified:
      step_state_machine: not_production_bound_retired
    verification_status: retired_vacuum_verus_artifact_pending_production_binding
    note: |
      vb-dzibx removed standalone Verus step-state models from production L4
      evidence. Current Verus state-machine artifacts are mirror models, not
      contracts on `vb_core::frame` transition code.

  - id: VB-CORE-STATE-002
