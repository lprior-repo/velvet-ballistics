# Proof Obligation Registry for velvet-ballistics
# Source of truth for all formal verification requirements
# Each obligation maps to: section references, proof level, required commands, evidence artifact

proof_levels:
  L0:
    name: "Mechanical scan"
    description: "Lint / CI evidence / forbidden token scan"
    tools: ["cargo clippy", "cargo fmt", "forbidden-scan", "hotpath-scan"]
  L1:
    name: "Unit + property tests"
    description: "Unit tests, property tests, differential tests"
    tools: ["cargo nextest", "proptest", "differential-test"]
  L2:
    name: "Fuzz / mutation / crash-lab"
    description: "Fuzzing, mutation testing, crash-lab fault injection"
    tools: ["cargo fuzz", "cargo mutants", "crash-lab"]
  L3:
    name: "Bounded model checking"
    description: "Kani model checker, bounded harness verification"
    tools: ["cargo kani"]
  L4:
    name: "Deductive Rust proof"
    description: "Verus formal verification of functional properties"
    tools: ["verus"]
  L5:
    name: "Proof assistant"
    description: "Lean via Aeneas for tiny pure kernels"
    tools: ["aeneas", "lean"]
  L6:
    name: "Operational evidence"
    description: "Benchmark, replay, recovery, supply-chain artifacts"
    tools: ["hyperfine", "replay-lab", "cargo audit"]

obligations:

  # ============================================================
  # VB-MRWE.6 PENDING ACTION INDEX WRITE BOUNDARY
  # ============================================================
  - id: obl-vb-mrwe-6-atomic-index-verus-001
    section: ["vb-mrwe.6", "REQ-MRWE6-ATOMIC-INDEX"]
    statement: |
      Every durable scheduled action event write stages the run_event atom and
      matching index_action atom in one write boundary or fails without relying
      on a partial commit.
    proof_level: L4
    crate: vb_storage
    files:
      - crates/vb_storage/src/journal/append/mrwe6_kernel.rs
      - verification/verus/vb_mrwe6_kernel_binding.rs
      - crates/vb_storage/src/batch.rs
      - crates/vb_storage/src/journal/internal.rs
    required:
      verus: verification/verus/vb_mrwe6_atomic_index.rs
    commands:
      - verus --crate-type=lib verification/verus/vb_mrwe6_atomic_index.rs

  - id: obl-vb-mrwe-6-queue-intent-verus-007
    section: ["vb-mrwe.6", "REQ-MRWE6-QUEUE-INTENT"]
    statement: |
      Queued scheduled and resolution events retain side-index intent through
      enqueue, flush_batch, strict persist, and drain_all boundaries.
    proof_level: L4
    crate: vb_storage
    files:
      - crates/vb_storage/src/journal/append/mrwe6_kernel.rs
      - verification/verus/vb_mrwe6_kernel_binding.rs
      - crates/vb_storage/src/queue/writer.rs
    required:
      verus: verification/verus/vb_mrwe6_queue_intent.rs
    commands:
      - verus --crate-type=lib verification/verus/vb_mrwe6_queue_intent.rs

  - id: obl-vb-mrwe-6-duplicate-verus-013
    section: ["vb-mrwe.6", "REQ-MRWE6-DUPLICATE"]
    statement: |
      Equal duplicate schedule retries are idempotent; divergent duplicate
      retries preserve existing state and classify as conflict.
    proof_level: L4
    crate: vb_storage
    files:
      - crates/vb_storage/src/journal/append/mrwe6_kernel.rs
      - verification/verus/vb_mrwe6_kernel_binding.rs
      - crates/vb_storage/src/journal/append/intent.rs
    required:
      verus: verification/verus/vb_mrwe6_duplicate_schedule.rs
    commands:
      - verus --crate-type=lib verification/verus/vb_mrwe6_duplicate_schedule.rs

  - id: obl-vb-mrwe-6-completion-policy-verus-019
    section: ["vb-mrwe.6", "REQ-MRWE6-COMPLETION-POLICY"]
    statement: |
      Completion/failure resolution commits remove the pending action marker in
      the same durable boundary as the resolution event.
    proof_level: L4
    crate: vb_storage
    files:
      - crates/vb_storage/src/journal/append/mrwe6_kernel.rs
      - verification/verus/vb_mrwe6_kernel_binding.rs
      - crates/vb_storage/src/journal/append/intent.rs
    required:
      verus: verification/verus/vb_mrwe6_completion_policy.rs
    commands:
      - verus --crate-type=lib verification/verus/vb_mrwe6_completion_policy.rs

  - id: obl-vb-mrwe-6-recovery-reliance-verus-025
    section: ["vb-mrwe.6", "REQ-MRWE6-RECOVERY-RELIANCE"]
    statement: |
      Recovery valid pending inventory is allowed only for event/index parity;
      mismatches classify as defect or explicit legacy fallback.
    proof_level: L4
    crate: vb_storage
    files:
      - crates/vb_storage/src/journal/append/mrwe6_kernel.rs
      - verification/verus/vb_mrwe6_kernel_binding.rs
      - crates/vb_storage/src/recovery/replay/summary.rs
    required:
      verus: verification/verus/vb_mrwe6_recovery_reliance.rs
    commands:
      - verus --crate-type=lib verification/verus/vb_mrwe6_recovery_reliance.rs

  # ============================================================
  # VB-MRWE.5 RECORD KIND PARITY (Section vb-mrwe.5)
  # Strict r11 binding: shared-source Verus/Rust kernel via
  # `#[path = "../../crates/vb_storage/src/mrwe5_contract.rs"]`
  # so the Verus artifact type-checks against the same dependency-free
  # production kernel consumed by `vb_storage` write/decode seams.
  # ============================================================
  - id: obl-vb-mrwe-5-kind-parity-verus-001
    section: ["vb-mrwe.5", "REQ-MRWE5-KIND-PARITY"]
    statement: |
      StepSucceeded maps to a distinct canonical kind id (29) that
      differs from SlotWrittenEvent (12); exact match is reflexive and
      cross-id mismatch is detected by the production kernel.
    proof_level: L4
    crate: vb_storage
    files:
      - crates/vb_storage/src/mrwe5_contract.rs
      - verification/verus/vb_mrwe5_kind_parity.rs
    required:
      verus: verification/verus/vb_mrwe5_kind_parity.rs
    commands:
      - verus --crate-type=lib verification/verus/vb_mrwe5_kind_parity.rs

  - id: obl-vb-mrwe-5-decode-reject-verus-006
    section: ["vb-mrwe.5", "REQ-MRWE5-DECODE-REJECT"]
    statement: |
      Semantic decode rejects envelope/payload kind mismatches before
      journal events are exposed; exact match with valid payload yields
      SemanticSuccess; exact match with invalid payload yields
      InvalidEvent; kind compatibility policy is fail-closed.
    proof_level: L4
    crate: vb_storage
    files:
      - crates/vb_storage/src/mrwe5_contract.rs
      - verification/verus/vb_mrwe5_decode_reject.rs
    required:
      verus: verification/verus/vb_mrwe5_decode_reject.rs
    commands:
      - verus --crate-type=lib verification/verus/vb_mrwe5_decode_reject.rs

  - id: obl-vb-mrwe-5-roundtrip-verus-011
    section: ["vb-mrwe.5", "REQ-MRWE5-ROUNDTRIP"]
    statement: |
      StepSucceeded and SlotWrittenEvent round-trip independently to
      SemanticSuccess when envelope kind, payload kind, and event
      validity all agree; cross-kind envelopes are rejected as
      KindPayloadMismatch.
    proof_level: L4
    crate: vb_storage
    files:
      - crates/vb_storage/src/mrwe5_contract.rs
      - verification/verus/vb_mrwe5_roundtrip.rs
    required:
      verus: verification/verus/vb_mrwe5_roundtrip.rs
    commands:
      - verus --crate-type=lib verification/verus/vb_mrwe5_roundtrip.rs

  - id: obl-vb-mrwe-5-compat-kind-family-verus-016
    section: ["vb-mrwe.5", "REQ-MRWE5-COMPAT-KIND-FAMILY"]
    statement: |
      The journal record-kind family accepts only kinds in [10..=29]
      under the journal magic; outside that family the record is
      rejected; kind compatibility is fail-closed for envelope/payload
      kind mismatches.
    proof_level: L4
    crate: vb_storage
    files:
      - crates/vb_storage/src/mrwe5_contract.rs
      - verification/verus/vb_mrwe5_compat_kind_family.rs
    required:
      verus: verification/verus/vb_mrwe5_compat_kind_family.rs
    commands:
      - verus --crate-type=lib verification/verus/vb_mrwe5_compat_kind_family.rs

  # ============================================================
