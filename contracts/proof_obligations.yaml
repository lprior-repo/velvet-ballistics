# ============================================================
# EVIDENCE FORMAT
# ============================================================
evidence_schema:
  kind: ProofEvidence
  bead: string
  commit: string
  obligations:
    - id: string
      status: pass | fail | waived | deferred
      level: L0 | L1 | L2 | L3 | L4 | L5 | L6
      commands:
        - string
      log: string
  remaining_assumptions:
    - string
  verified:
    taint_lattice: deductively_verified | property_tested | fuzzed | externally_assumed | not_production_bound_retired
    step_state: deductively_verified | bounded_model_checked | property_tested | not_production_bound_retired
    resource_budget: deductively_verified | bounded_model_checked | property_tested | not_production_bound_retired
    ipc_decoder: fuzzed_and_bounded_model_checked | bounded_model_checked | fuzzed
    generated_parity: differentially_tested | property_tested
    replay_safety: model_checked_and_crash_lab_evidenced | model_checked | fuzzed
    fjall_durability: externally_assumed_with_strict_fsync_boundary | operationally_evidenced

# ============================================================
# PROOF LEVEL ASSIGNMENTS BY CRATE
# ============================================================
proof_matrix:
  vb_core::ids:
    proof_strategy: "Kani + Verus. Prove checked conversion, checked indexing, no unchecked arithmetic/casts."
    primary_level: L3
    secondary_level: L4
  vb_core::value:
    proof_strategy: "Kani/property tests for production taint lattice, ConstValue total mapping, handle validity. Tests for FiniteF64. The standalone Verus taint_lattice mirror is retired as non-production-bound under vb-dzibx; future Verus must bind directly to vb_core::value::Taint/join_taint."
    primary_level: L4
    secondary_level: L3
  vb_core::frame:
    proof_strategy: "Kani/tests for production step-state transitions and slot bounds. Standalone Verus step-state mirrors are retired as non-production-bound under vb-dzibx; future Verus must bind to production frame transition code. Kani for StepBudget."
    primary_level: L4
    secondary_level: L3
  vb_core::engine:
    proof_strategy: "Reference model + differential tests first. Verus only for small nodes: Nop, SetConst, Copy, Finish, ChooseSlot."
    primary_level: L2
    secondary_level: L4
  vb_expr:
    proof_strategy: "Property tests and differential tests: AST interpreter vs bytecode. Kani for stack-depth arithmetic and overflow. Fuzz arbitrary expression bytes."
    primary_level: L2
    secondary_level: L3
  vb_yaml:
    proof_strategy: "Fuzz + golden diagnostics. Do not try full formal parser proof. Prove 'no panic, typed failure, no forbidden YAML accepted'. No vb_yaml Verus artifact is registered or marked deductively_verified; prior standalone mirror-model artifacts were retired as non-proof under vb-dzibx. Future Verus for vb_yaml requires an extracted production-bound pure kernel or direct production requires/ensures binding."
    primary_level: L2
    secondary_level: L1
    retired_non_proof_verus_artifact_status: "removed from tree under vb-dzibx; no vb_yaml Verus file path is registered as proof evidence"
  vb_validate:
    proof_strategy: "Property tests over generated ASTs. Verus for small validators if extracted into pure kernels."
    primary_level: L1
    secondary_level: L4
  vb_compile:
    proof_strategy: "Differential tests: YAML → AST → IR → reference model. Verus/Kani for WholeWorkflowBudget arithmetic."
    primary_level: L2
    secondary_level: L4
  vb_ajc40_flux:
    proof_strategy: "Flux/proptest smoke only; no current L4 production-binding closure. The prior verification/verus/vb_ajc40_flux_contracts.rs artifact is retired as a local mirror model under vb-dzibx; it must not be cited as deductively_verified evidence for vb_core admission or vb_ajc40_flux positive.rs contracts unless replaced by a mechanically auditable production binding. The dead positive.rs #[cfg(verus)] block was removed rather than treated as proof."
    primary_level: L1
    secondary_level: L4
    verification_status: retired_vacuum_verus_artifact_pending_production_binding
    retired_non_proof_verus_artifacts:
      - verification/verus/vb_ajc40_flux_contracts.rs
  vb_storage:
    proof_strategy: "Kani for envelope header decode, length checks, sequence arithmetic. Fuzz records. Crash-lab for journal/recovery semantics."
    primary_level: L3
    secondary_level: L2
  vb_runtime:
    proof_strategy: "TLA+/PlusCal model for journal/recovery/action ordering. Loom for shard queue/cancel/action-completion races. Differential tests against reference engine. Verus for pure attempt-fence kernels (L4)."
    primary_level: L3
    secondary_level: L4
  vb_ipc:
    proof_strategy: "Kani + fuzz for IPC decode, length checks, and reject-before-allocation. The prior vb_5iebh Verus artifact is retired as a local model only under vb-dzibx; IPC has no current L4 closure until production-bound contracts or reviewed bridge proofs land."
    primary_level: L3
    secondary_level: L4
  vb_queue_semantics:
    proof_strategy: "Unit/property-style Rust tests and existing helper annotations cover current queue behavior. The prior queue_semantics Verus specs/bridges were retired under vb-dzibx as local non-proof sketches: they used mirror types/local models, lacked extern_spec or production contracts, and must not be counted as L4 closure. Future Verus requires production-bound contracts against crates/vb_queue_semantics/src/lib.rs or an extracted reviewed kernel."
    primary_level: L2
    secondary_level: L4
    verification_status: retired_vacuum_verus_artifact_pending_production_binding
    retired_non_proof_verus_artifacts:
      - crates/vb_queue_semantics/verification/verus/queue_semantics_exec_bridges.rs
      - crates/vb_queue_semantics/verification/verus/queue_semantics_specs.rs
  vb_proof_kernels:
    proof_strategy: "Local sanity kernels only. vb-dzibx marks taint.rs, profile_contract/master.rs, resource_budget.rs, step_state.rs, envelope_header.rs, and vb_kyyf_normalization.rs as non-production-bound until reviewed bridges or production contracts exist."
    primary_level: L0
    secondary_level: L4
    verification_status: retired_vacuum_verus_artifact_pending_production_binding
    retired_non_proof_verus_artifacts:
      - crates/vb_proof_kernels/src/taint.rs
      - crates/vb_proof_kernels/src/profile_contract/master.rs
      - crates/vb_proof_kernels/src/resource_budget.rs
      - crates/vb_proof_kernels/src/step_state.rs
      - crates/vb_proof_kernels/src/envelope_header.rs
      - crates/vb_proof_kernels/src/vb_kyyf_normalization.rs
      - verification/verus/taint_lattice.rs
      - verification/verus/vb_kyyf_normalization.rs
  vb_ui_model:
    proof_strategy: "Schema tests, redaction tests, bounded-list tests."
    primary_level: L1
    secondary_level: L0
  vb_ui_makepad:
    proof_strategy: "Snapshot, overlap, redaction, no-runtime-core dependency gates. Formal proof is not worth it here."
    primary_level: L0
    secondary_level: L1
  supply_chain:
    proof_strategy: "cargo audit, cargo deny, cargo vet, cargo geiger, dependency-scope beads."
    primary_level: L0
    secondary_level: L6


