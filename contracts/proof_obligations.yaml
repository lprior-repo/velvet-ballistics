  # ============================================================
  # CONCURRENCY SEAMS (Loom)
  # ============================================================
  - id: VB-CONC-001
    section: [49]
    statement: |
      Journal writer queue: ordered write before flush
    proof_level: L3
    crate: vb_runtime
    files:
