# ============================================================
# VERUS SPEC REGISTRY (STRONG PRODUCTION BINDING)
# ============================================================
# Compact registration index of every STRONG-bound Verus spec file
# under verification/verus/ that establishes an auditable production
# binding via the extern_*.rs mirror + #[path] mechanism (GOD RULE 2).
# Each entry maps a spec file to its primary production source. The
# detailed obligation entries above (VB-*) cite these files where
# relevant; this section is the canonical lookup for which production
# source each Verus spec file is bound to.
#
# Trust boundary: every extern mirror wraps production exec bodies in
# #[verifier::external] so Verus verifies only structural resolution,
# discriminant-set closure, and contract well-formedness — not the
# production body semantics. Drift between the mirror and the
# production source is the explicit drift-detection mechanism.
# ============================================================
verus_registry:

  # --- vb_core safety kernels ------------------------------------------
  - id: PO-VERUS-001
    description: "WholeWorkflowBudget boundedness: sequential, nested, branch, aggregate, diagnostic totals stay within BoundednessPolicy limits (no u64 overflow on composition)."
    verus: verification/verus/budget_bounded.rs
    production: crates/vb_core/src/budget.rs

  - id: PO-VERUS-002
    description: "WholeWorkflowBudget::compute arithmetic: max_total_steps/slots/fanout/depth computed from IR traversal; CollectStart budget arithmetic bound to production (PO-024)."
    verus: verification/verus/budget_computation.rs
    production: crates/vb_core/src/budget.rs

  - id: PO-VERUS-003
    description: "WholeWorkflowBudget monotonicity: identical (nodes, entry, contract) inputs produce identical computed dimensions across recomputation (INV-005)."
    verus: verification/verus/budget_monotonic.rs
    production: crates/vb_core/src/budget.rs

  - id: PO-VERUS-004
    description: "RunFrame construction and reinitialization invariants: PRE-001, POST-001, INV-007 (VB-CORE-RUNFRAME-001..003)."
