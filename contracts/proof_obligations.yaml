# ============================================================
# PROOF LEVEL ASSIGNMENTS BY CRATE
# ============================================================
proof_matrix:
  vb_core::ids:
    proof_strategy: "Kani + Verus. Prove checked conversion, checked indexing, no unchecked arithmetic/casts."
    primary_level: L3
    secondary_level: L4
  vb_core::value:
    proof_strategy: "Verus/Kani for taint lattice, ConstValue total mapping, handle validity. Tests for FiniteF64."
    primary_level: L4
    secondary_level: L3
  vb_core::frame:
    proof_strategy: "Verus for step-state transitions and slot bounds. Kani for StepBudget."
    primary_level: L4
    secondary_level: L3
  vb_core::engine:
    proof_strategy: "Reference model + differential tests first. Verus only for small nodes: Nop, SetConst, Copy, Finish, ChooseSlot."
    primary_level: L2
    secondary_level: L4
  vb_expr:
    proof_strategy: "Property tests and differential tests: AST interpreter vs bytecode. Kani for stack-depth arithmetic and overflow. Fuzz arbitrary expression bytes."
    primary_level: L2
    secondary_level: L3
  vb_yaml:
    proof_strategy: "Fuzz + golden diagnostics. Do not try full formal parser proof. Prove 'no panic, typed failure, no forbidden YAML accepted'."
    primary_level: L2
    secondary_level: L1
  vb_validate:
    proof_strategy: "Property tests over generated ASTs. Verus for small validators if extracted into pure kernels."
    primary_level: L1
    secondary_level: L4
  vb_compile:
    proof_strategy: "Differential tests: YAML → AST → IR → reference model. Verus/Kani for WholeWorkflowBudget arithmetic."
    primary_level: L2
    secondary_level: L4
  vb_storage:
    proof_strategy: "Kani for envelope header decode, length checks, sequence arithmetic. Fuzz records. Crash-lab for journal/recovery semantics."
    primary_level: L3
    secondary_level: L2
  vb_runtime:
    proof_strategy: "TLA+/PlusCal model for journal/recovery/action ordering. Loom for shard queue/cancel/action-completion races. Differential tests against reference engine."
    primary_level: L3
    secondary_level: L2
  vb_ipc:
    proof_strategy: "Kani + fuzz. The key property is 'reject before allocation'."
    primary_level: L3
    secondary_level: L2
  vb_ui_model:
    proof_strategy: "Schema tests, redaction tests, bounded-list tests."
    primary_level: L1
    secondary_level: L0
  vb_ui_makepad:
    proof_strategy: "Snapshot, overlap, redaction, no-runtime-core dependency gates. Formal proof is not worth it here."
    primary_level: L0
    secondary_level: L1
  supply_chain:
    proof_strategy: "cargo audit, cargo deny, cargo vet, cargo geiger, dependency-scope beads."
    primary_level: L0
    secondary_level: L6
