      - cargo nextest run -p vb_codegen --test trybuild

  # ============================================================

  # REFERENCE MODEL CORRECTNESS
  # ============================================================
  - id: VB-REF-001
    section: [17, 45, 47]
    statement: |
      Reference engine == optimized engine on all defined inputs
    proof_level: L2
    crate: reference
    files:
      - reference/engine_model.rs
    required:
