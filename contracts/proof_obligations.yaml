      tests: [taint_join_associative, taint_join_commutative, taint_join_idempotent]
    commands:
      - cargo nextest run -p vb_core taint_join
    verified:
      taint_lattice: not_production_bound_retired
    verification_status: retired_vacuum_verus_artifact_pending_production_binding
    note: |
      vb-dzibx retired the prior standalone `verification/verus/taint_lattice.rs`
      L4 claim. That file defines parallel `SpecTaint` values and is not bound
      to production `vb_core::value::Taint` / `join_taint`; it may be run only
      as a local sanity model until a production-bound Verus contract lands.

  - id: VB-CORE-TAINT-002
