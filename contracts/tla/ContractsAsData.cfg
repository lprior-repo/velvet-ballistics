---------------------------- MODULE ContractsAsData ----------------------------
MAX_FILES <- 5
MAX_FILE_VERSION <- 10

-- TLC Model Check Settings
-- ========================
-- This configuration file sets bounds for model checking the
-- contracts-as-data pipeline (vb-6f02).
--
-- MAX_FILES = 5: Checks invariant satisfaction with up to 5 contract files.
--   This is small enough for exhaustive state exploration but large enough
--   to verify BTreeMap ordering, version constraint enforcement, and
--   gate pass/fail logic.
--
-- MAX_FILE_VERSION = 10: Bounds semver components to 0..10.
--   This keeps the state space manageable while verifying:
--   - Semver parsing (leading zeros, format validation)
--   - Version comparison (lexicographic ordering)
--   - Version monotonicity (new >= old constraint)
--
-- Expected state space: < 100,000 states
-- Expected verification time: < 30 seconds
--
-- To run: tlc ContractsAsData.tla -configfile ContractsAsData.tla.cfg
